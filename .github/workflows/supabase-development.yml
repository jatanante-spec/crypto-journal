name: Supabase development migrations

on:
  push:
    branches:
      - supabase-development
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-development.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-development-migrations
  cancel-in-progress: false

jobs:
  apply-migrations:
    name: Apply migrations to development Supabase
    runs-on: ubuntu-24.04
    env:
      # This must be the IPv4-compatible Session pooler URI from Dashboard -> Connect.
      # Keep the complete URI in GitHub Actions as an encrypted repository secret.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Check database URL secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL GitHub secret is missing"
            exit 1
          fi

      - name: Preview pending development migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply development migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
