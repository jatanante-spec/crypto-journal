name: Supabase development migrations

on:
  push:
    branches:
      - supabase-development
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-development.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-development-migrations
  cancel-in-progress: false

jobs:
  apply-migrations:
    name: Apply migrations to development Supabase
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link development project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending development migrations
        run: supabase db push --linked --dry-run

      - name: Apply development migrations
        run: supabase db push --linked
