name: Deploy development market-data function

on:
  push:
    branches:
      - supabase-development
    paths:
      - 'supabase/config.toml'
      - 'supabase/functions/market-data/**'
      - '.github/workflows/supabase-development-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-development-market-data-function
  cancel-in-progress: false

jobs:
  deploy-market-data:
    name: Deploy market-data to development Supabase
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Optional. If present, it is stored only in Supabase Edge Function secrets.
      COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deployment secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN GitHub secret is missing"
            exit 1
          fi

      - name: Set optional CoinGecko demo key
        if: env.COINGECKO_DEMO_KEY != ''
        run: supabase secrets set --project-ref cvwdegezormxxhskojmf "COINGECKO_DEMO_KEY=$COINGECKO_DEMO_KEY"

      - name: Deploy development function with JWT verification enabled
        run: supabase functions deploy market-data --project-ref cvwdegezormxxhskojmf
