name: Deploy online development Journal frontend

# Manual only. Cloudflare Pages (deploy-frontend.yml) is the live Journal. Supabase serves HTML from
# its default functions domain as text/plain, so this copy shows source code rather than the app.
# Start it from Actions -> this workflow -> "Run workflow" if you ever need it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-development-journal-frontend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Publish online development Journal frontend
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Check deployment secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN GitHub secret is missing"
            exit 1
          fi

      - name: Assemble exact development Journal frontend
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import path from 'node:path';

          const root = process.cwd();
          const read = (file) => readFile(path.join(root, file), 'utf8');
          const [index, styles, javascript, runtime] = await Promise.all([
            read('apps-script/Index.html'),
            read('apps-script/Styles.html'),
            read('apps-script/JavaScript.html'),
            read('dev/supabase_runtime.js')
          ]);

          const stylesMarker = "<?!= include('Styles'); ?>";
          const javascriptMarker = "<?!= include('JavaScript'); ?>";
          if (!index.includes(stylesMarker) || !index.includes(javascriptMarker)) {
            throw new Error('apps-script/Index.html does not contain the expected Apps Script include markers.');
          }

          const runtimeScript = `<script>\n${runtime}\n</script>`;
          const output = index
            .replace(stylesMarker, () => styles)
            .replace(javascriptMarker, () => `${runtimeScript}\n${javascript}`);

          const functionDir = path.join(root, 'supabase', 'functions', 'journal-online');
          await mkdir(functionDir, { recursive: true });
          const functionSource = [
            `const html = ${JSON.stringify(output)};`,
            '',
            'Deno.serve((request) => {',
            "  if (request.method !== 'GET' && request.method !== 'HEAD') {",
            "    return new Response('GET required.', { status: 405 });",
            '  }',
            "  return new Response(request.method === 'HEAD' ? null : html, {",
            '    headers: {',
            "      'content-type': 'text/html; charset=utf-8',",
            "      'cache-control': 'no-store',",
            "      'access-control-allow-origin': '*'",
            '    }',
            '  });',
            '});',
            ''
          ].join('\n');
          await writeFile(path.join(functionDir, 'index.ts'), functionSource, 'utf8');
          NODE

      - name: Configure development frontend function
        shell: bash
        run: |
          if ! grep -q '^\[functions\.journal-online\]' supabase/config.toml; then
            printf '\n[functions.journal-online]\nverify_jwt = false\n' >> supabase/config.toml
          fi

      - name: Deploy online development Journal frontend
        run: supabase functions deploy journal-online --project-ref cvwdegezormxxhskojmf

      - name: Print development Journal URL
        run: |
          echo "Development Journal URL: https://cvwdegezormxxhskojmf.supabase.co/functions/v1/journal-online"
