<html>
  <head>
    <base target="_top">

    <div class="app">
      <nav class="nav">
        <div class="brand">
          <h1>Scalping journal</h1>

        </div>
        <button type="button" data-page="sizer" class="active">Sizer</button>
        <button type="button" data-page="journal">Journal</button>
        <button type="button" data-page="market">Market</button>
        <button type="button" data-page="settings"><span class="nav-wide">Settings</span><span class="nav-narrow">More</span></button>
        <div class="nav-spacer" style="flex:1"></div>
        <button type="button" class="nav-train" id="train-toggle" data-action="toggle-training">Trade</button>

        <div id="budget"></div>
        <main id="main"></main>

    <div id="pill-pop" hidden>
      <div class="pill-pop-card" id="pill-pop-card" role="dialog" aria-modal="false"></div>

    <div id="watchlist-root" hidden>
      <div class="watchlist-scrim" data-action="close-watchlist"></div>
      <div class="watchlist-sheet strip" id="watchlist-sheet" data-mood="ink" role="dialog" aria-modal="true" aria-labelledby="wl-title">
        <div class="watchlist-grab" aria-hidden="true"></div>
        <div class="watchlist-head">
          <h2 id="wl-title">Scout <span id="wl-seats" class="wl-seats">0 / 8</span></h2>

            <button type="button" class="watchlist-expand" id="wl-expand" data-action="toggle-watchlist-full" aria-label="Full screen" title="Full screen">⤢</button>
            <button type="button" class="watchlist-x" data-action="close-watchlist" aria-label="Close">×</button>
          </div>
        </div>
        <div class="wl-mode-tabs" id="wl-mode-tabs">
          <button type="button" data-action="wl-mode" data-wl-mode="scout" class="on">Scout</button>
          <button type="button" data-action="wl-mode" data-wl-mode="seats">Seats</button>
          <button type="button" data-action="wl-mode" data-wl-mode="library">Library</button>
          <button type="button" data-action="wl-mode" data-wl-mode="find">Find</button>
        </div>
        <div class="wl-tools">
          <input class="watchlist-search" id="wl-search" type="search" placeholder="Filter…" autocomplete="off" />
          <button type="button" class="wl-peek-all" id="wl-peek-all" data-action="scout-peek-all" hidden>Peek all</button>
        </div>
        <div class="wl-mood" id="wl-mood" hidden>
          <span class="wl-mood-label">Mood</span>
          <button type="button" data-action="scout-mood" data-mood="ink">Ink</button>
          <button type="button" data-action="scout-mood" data-mood="slate">Slate</button>
          <button type="button" data-action="scout-mood" data-mood="paper">Paper</button>
        </div>
        <p class="wl-legend" id="wl-legend" hidden>
          <span><i class="book"></i>Book</span>
          <span><i class="peek"></i>Peek</span>
          <span><i class="none"></i>Empty</span>
          <span class="wl-legend-note">· tape skim · not Gates</span>
        </p>
        <div class="watchlist-catalog" id="wl-catalog"></div>
        <p class="watchlist-toast" id="wl-toast"></p>
        <details class="watchlist-adv">
          <summary>Custom coin (advanced)</summary>
          <div class="watchlist-adv-grid">
            <label>Ticker<input id="wl-ticker" placeholder="MANA" maxlength="12" /></label>
            <label>Sample £<input id="wl-sample" placeholder="0.28" inputmode="decimal" /></label>
            <label class="full">CoinGecko id<input id="wl-id" placeholder="decentraland" /></label>
          </div>
          <div class="row" style="margin-top:8px">
            <button type="button" class="btn" data-action="watchlist-add-custom">Add to library</button>
            <button type="button" class="btn secondary" data-action="watchlist-clear-custom">Clear</button>
          </div>
        </details>
      </div>
    </div>
    <div id="quick-switch-root" hidden>
      <div class="quick-switch-backdrop" data-action="quick-close"></div>
      <section class="quick-switch-panel" id="quick-switch-panel" role="dialog" aria-modal="true" aria-labelledby="quick-switch-title">
        <div class="quick-switch-handle" aria-hidden="true"></div>
        <header class="quick-switch-head">
          <div class="quick-switch-heading">
            <div>
              <h2 id="quick-switch-title">Switch coin</h2>
              <p id="quick-switch-destination">Open in the current screen · no Fetch required</p>
            </div>
            <button type="button" id="quick-switch-close" data-action="quick-close" aria-label="Close coin switcher">×</button>
          </div>
          <input id="quick-switch-search" type="search" placeholder="Search saved coins…" aria-label="Search saved coins" autocomplete="off">
          <div class="quick-switch-filters" role="group" aria-label="Coin switcher filter">
            <button type="button" id="quick-switch-all" data-action="quick-filter" data-filter="all" aria-pressed="true">All saved</button>
            <button type="button" id="quick-switch-favourites" data-action="quick-filter" data-filter="favourites" aria-pressed="false">★ Favourites</button>
          </div>
        </header>
        <div id="quick-switch-list" tabindex="0" role="listbox" aria-label="Saved coins"></div>
        <footer class="quick-switch-foot">
          <span id="quick-switch-count">0 of 0 results</span>
          <button type="button" id="quick-switch-more" data-action="quick-more" hidden>Show more</button>
          <button type="button" data-action="quick-library">Manage library</button>
        </footer>
      </section>
    </div>
    <div id="trend-dialog-root" hidden>
      <div class="trend-dialog-backdrop" data-action="trend-close"></div>
      <section class="trend-dialog" id="trend-dialog" role="dialog" aria-modal="true" aria-labelledby="trend-dialog-title">
        <header>
          <div><h2 id="trend-dialog-title">Signal history</h2><small id="trend-dialog-subtitle"></small></div>
          <button type="button" id="trend-dialog-close" data-action="trend-close" aria-label="Close">×</button>
        </header>
        <div id="trend-dialog-body"></div>
      </section>
    </div>
    <dialog id="cd-dialog" aria-labelledby="cd-dialog-title">
      <header class="cd-dialog-head">
        <div><h2 id="cd-dialog-title">Cue Deck</h2><small>Read-only instrument evidence</small></div>
        <button type="button" id="cd-dialog-close" data-action="cd-close" aria-label="Close Cue Deck">×</button>
      </header>
      <div id="cd-dialog-body"></div>
    </dialog>
