<style>
:root {
  color-scheme: dark;
  --bg: #0b1220;
  --panel: #151f35;
  --panel-2: #1b2742;
  --line: #2a3a5c;
  --text: #e8eefc;
  --muted: #93a0c0;
  --input: #0e1730;
  --accent: #3d7dff;
  --green: #3dcf8e;
  --green-bg: #123526;
  --yellow: #e6c35c;
  --yellow-bg: #332c12;
  --red: #ff6b7a;
  --red-bg: #3a1520;
  --radius: 14px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
  font-family: "Segoe UI", "IBM Plex Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}
body {
  background:
    radial-gradient(900px 500px at 10% -10%, #1a2b55 0%, transparent 55%),
    radial-gradient(700px 400px at 100% 0%, #15243f 0%, transparent 50%),
    var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
.app {
  display: grid;
  grid-template-columns: 220px 1fr;
  min-height: 100vh;
}
.stage { min-width: 0; display: flex; flex-direction: column; }
#budget { position: sticky; top: 0; z-index: 4; background: var(--bg); padding: 0; }
.nav {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 22px 14px;
  background: rgba(11, 18, 32, 0.92);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.brand { padding: 4px 10px 18px; }
.brand h1 { margin: 0; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; }
.brand p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
.nav button {
  text-align: left;
  background: transparent;
  border: 0;
  border-radius: 10px;
  padding: 10px 12px;
  color: var(--muted);
  cursor: pointer;
}
.nav button.active, .nav button:hover { background: var(--panel); color: var(--text); }
.nav button.active { box-shadow: inset 3px 0 0 var(--accent); }
.nav-narrow { display: none; }
.nav-train.on { color: var(--yellow); background: var(--yellow-bg); }
main { padding: 28px 28px 48px; max-width: 1180px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
.page-head h2 { margin: 0 0 6px; font-size: 28px; }
.page-head p { margin: 0; color: var(--muted); }
.grid { display: grid; gap: 16px; }
.grid.two { grid-template-columns: 1.1fr 0.9fr; }
.grid.three { grid-template-columns: repeat(3, 1fr); }
.grid.stats { grid-template-columns: repeat(5, 1fr); }
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
}
.card h3 { margin: 0 0 14px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field select {
  background: var(--input);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  outline: none;
}
.field.yellow input, .field.yellow select { background: var(--yellow-bg); border-color: #5c4d1d; }
.results { display: grid; gap: 8px; }
.result {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  background: var(--green-bg);
  border-radius: 10px;
  padding: 10px 12px;
}
.result span { color: var(--muted); font-size: 13px; }
.result strong { color: var(--green); }
.result.warn { background: var(--red-bg); }
.result.warn strong { color: var(--red); }
.stat { background: var(--panel-2); border-radius: 12px; padding: 12px; }
.stat label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.stat b { font-size: 20px; }
.verdict { display: inline-block; padding: 8px 12px; border-radius: 999px; font-weight: 700; letter-spacing: 0.06em; }
.verdict.FAVOURABLE { background: var(--green-bg); color: var(--green); }
.verdict.MIXED { background: var(--yellow-bg); color: var(--yellow); }
.verdict.UNFAVOURABLE, .verdict.OVERBOUGHT { background: var(--red-bg); color: var(--red); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { background: var(--accent); color: white; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
.btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
.btn.danger { background: var(--red-bg); color: var(--red); }
.btn:disabled { opacity: 0.55; cursor: wait; }
.help { margin-top: 8px; }
.help summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.help p, .help ol { color: var(--muted); font-size: 13px; line-height: 1.5; }
.table-wrap { overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 6px; white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
td { border-bottom: 1px solid rgba(42, 58, 92, 0.5); }
.muted { color: var(--muted); }
.score-bar { height: 10px; background: #0e1730; border-radius: 99px; overflow: hidden; margin-top: 8px; }
.score-bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); }
.status, .toast-error { font-size: 13px; }
.status.live { color: var(--green); }
.status.sample, .status.stale { color: var(--yellow); }
.toast-error { color: var(--red); }
.closes-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.groups { display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 10px; }
.cluster { border: 1px solid #5c4d1d; border-radius: 10px; overflow: hidden; background: var(--yellow-bg); }
.cluster + .cluster { margin-top: 10px; }
.cluster-tag { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--yellow); padding: 8px 10px 2px; }
.cluster-row { display: grid; }
.cluster-row.cols-2 { grid-template-columns: 1fr 1fr; }
.cluster-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.cluster-row.cols-4 { grid-template-columns: repeat(4, 1fr); }
.cell { display: flex; flex-direction: column; gap: 2px; padding: 6px 8px 8px; border-right: 1px solid #5c4d1d; border-top: 1px solid #5c4d1d; min-width: 0; }
.cluster-row.cols-2 .cell:nth-child(2n),
.cluster-row.cols-3 .cell:nth-child(3n),
.cluster-row.cols-4 .cell:nth-child(4n),
.cluster-row .cell:last-child { border-right: 0; }
.cluster-row.cols-2 .cell:nth-child(-n + 2),
.cluster-row.cols-3 .cell:nth-child(-n + 3),
.cluster-row.cols-4 .cell:nth-child(-n + 4) { border-top: 0; }
.cluster-row + .cluster-row .cell { border-top: 1px solid #5c4d1d; }
.cell span { font-size: 11px; color: var(--muted); }
.cell input, .cell select { width: 100%; min-width: 0; background: transparent; border: 0; padding: 2px 0 0; outline: none; }
.cell input[type=number]::-webkit-outer-spin-button,
.cell input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.cell input[type=number] { -moz-appearance: textfield; appearance: textfield; }
.risk-line { display: flex; align-items: center; gap: 4px; }
.risk-line input { flex: 1; min-width: 0; }
.stepper { display: flex; flex-direction: row; flex-shrink: 0; gap: 3px; }
.stepper button {
  width: 24px;
  height: 24px;
  padding: 0;
  line-height: 22px;
  font-size: 14px;
  font-weight: 700;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--text);
  cursor: pointer;
}

.sizer-screen { display: flex; flex-direction: column; gap: 6px; max-width: 560px; }
.sizer-mega {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.sizer-mega-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  padding: 2px 0 0;
}
.sizer-mega .coin-row { margin: 0; }
.sizer-mega .coin-row .tag {
  font-size: 11px;
  padding: 3px 9px;
  font-weight: 700;
}
.sizer-mega-fresh {
  font-size: 10px;
  color: var(--muted);
  opacity: 0.9;
  white-space: nowrap;
}
.sizer-mega-fresh.stale { color: var(--yellow); }
.sizer-mega-links {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
  flex-wrap: wrap;
}
.mega-link {
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  font: inherit;
  font-size: 11px;
  font-weight: 650;
  color: var(--text);
  cursor: pointer;
}
.mega-link.man { color: var(--yellow); font-weight: 700; }
.mega-link.on { color: var(--accent); }
.mega-link.man.on { color: var(--yellow); text-decoration: underline; text-underline-offset: 2px; }
.mega-sep { color: var(--line); font-size: 11px; user-select: none; }
.sizer-mega .sizer-actions { margin-left: 0; }
.sizer-mega .sizer-actions .btn {
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 650;
  border-radius: 999px;
}
.sizer-mega > .teach:has(details:not([open])),
.sizer-mega .gate-row.mega:not(:has(details[open])),
.sizer-mega > details.story:not([open]) { display: none; }
.sizer-mega .gate-row.mega { margin: 0; }
.sizer-mega .gate-row.mega .evidence-fold > summary,
.sizer-mega details.story > summary {
  font-size: 11px;
  padding: 6px 8px;
}
.sizer-mega details.story {
  margin: 0;
  padding: 4px 8px;
}
.page-sizer .budget-bar {
  padding: 2px 10px;
  gap: 5px;
}
.page-sizer .budget-track { flex: 0 0 22px; }
.page-sizer .budget-bar span { font-size: 10px; max-width: 38vw; }
.sizer-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sizer-top h2 { margin: 0; font-size: 22px; }
.sizer-top p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.sizer-top .btn { padding: 8px 12px; }
.sizer-actions { gap: 6px; flex-shrink: 0; }
.sizer-toolbar {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 8px;
  min-height: 0;
  padding: 2px 0 0;
}
.sizer-toolbar .coin-row { margin: 0; flex: 0 0 auto; }
.sizer-toolbar .tag-row { margin-top: 0; }
.sizer-toolbar .sizer-actions { margin-left: auto; }
.sizer-toolbar .btn {
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 650;
  border-radius: 999px;
}
.sizer-fresh {
  margin: 2px 0 4px;
  font-size: 10px;
  line-height: 1.2;
  color: var(--muted);
  opacity: 0.85;
}
.sizer-fresh.live { color: var(--muted); }
.coin-row .tag {
  font-size: 13px;
  padding: 6px 13px;
  font-weight: 700;
}
.sizer-hero { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 8px; }
.sizer-hero > div, .sizer-hero > .teach { background: var(--green-bg); border-radius: 10px; padding: 8px 10px; }
.sizer-hero > .teach > div { background: none; padding: 0; }
.sizer-hero label { display: block; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.sizer-hero b { display: block; font-size: 22px; color: var(--green); line-height: 1.15; }
.sizer-hero small { color: var(--muted); font-size: 11px; }
.sizer-hero.warn > div:last-child, .sizer-hero.warn > .teach:last-child { background: var(--red-bg); }
.sizer-hero.warn > div:last-child b, .sizer-hero.warn > .teach:last-child b { color: var(--red); }
.sizer-hero.invalid > div, .sizer-hero.invalid > .teach { background: var(--red-bg); }
.sizer-hero.invalid > div b, .sizer-hero.invalid > .teach b { color: var(--red); }
.session-bar, .go-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px 10px;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12px;
  border: 1px solid var(--line);
  background: var(--panel);
}
.session-bar b, .go-bar b { letter-spacing: 0.06em; }
.session-bar span, .go-bar span { color: var(--muted); flex: 1; min-width: 140px; }
.session-bar small { color: var(--muted); font-size: 11px; }
.go-bar { flex-direction: column; align-items: stretch; gap: 6px; }
.go-bar > div:first-child { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.go-checks { display: flex; flex-wrap: wrap; gap: 5px; }
.go-checks i { font-style: normal; font-size: 10px; border-radius: 999px; padding: 2px 7px; background: var(--panel-2); color: var(--muted); }
.go-checks i.ok { color: var(--green); background: var(--green-bg); }
.go-checks i.bad { color: var(--red); background: var(--red-bg); }
.story {
  border-radius: 10px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  background: var(--panel);
}
.story summary {
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.02em;
  list-style: none;
}
.story summary::-webkit-details-marker { display: none; }
.story[open] summary { margin-bottom: 6px; }
.story ol { margin: 0; padding-left: 18px; color: var(--text); font-size: 13px; line-height: 1.45; }
.story li { margin: 0 0 6px; }
.story p { margin: 8px 0 0; font-size: 14px; font-weight: 700; }
.story.FAVOURABLE { background: var(--green-bg); border-color: #1e5a3c; }
.story.FAVOURABLE summary, .story.FAVOURABLE p { color: var(--green); }
.story.MIXED { background: var(--yellow-bg); border-color: #5c4d1d; }
.story.MIXED summary, .story.MIXED p { color: var(--yellow); }
.story.UNFAVOURABLE { background: var(--red-bg); border-color: #6a2430; }
.story.UNFAVOURABLE summary, .story.UNFAVOURABLE p { color: var(--red); }
.scoreboard { border: 0; border-radius: 0; padding: 0; background: none; }
.scoreboard summary { font-size: 11px; color: var(--muted); padding: 2px 0; cursor: pointer; }
.scoreboard .go-bar, .scoreboard .session-bar { margin-top: 4px; }
.session-bar.OPEN { background: var(--panel); }
.session-bar.OPEN b { color: var(--muted); }
.go-bar.FAVOURABLE { background: var(--green-bg); border-color: #1e5a3c; }
.go-bar.FAVOURABLE b { color: var(--green); }
.session-bar.STOP, .go-bar.UNFAVOURABLE { background: var(--red-bg); border-color: #6a2430; }
.session-bar.STOP b, .go-bar.UNFAVOURABLE b { color: var(--red); }
.session-bar.BANK, .go-bar.MIXED { background: var(--yellow-bg); border-color: #5c4d1d; }
.session-bar.BANK b, .go-bar.MIXED b { color: var(--yellow); }
.budget-bar {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 14px;
  min-height: 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  background: transparent;
}
.budget-bar strong {
  font-size: 11px;
  font-weight: 650;
  color: #7a8fa8;
  letter-spacing: 0;
  white-space: nowrap;
}
.budget-bar.OPEN strong { color: #6d9b82; }
.budget-bar b { font-size: 9px; letter-spacing: 0.06em; color: var(--muted); white-space: nowrap; }
.budget-track {
  flex: 0 0 28px;
  height: 2px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
  opacity: 0.85;
}
.budget-track > i { display: block; height: 100%; background: #6d9b82; }
.budget-bar span {
  font-size: 10px;
  color: var(--muted);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  opacity: 0.8;
}
.budget-bar.teach { padding-right: 8px; }
.budget-bar .tip-btn {
  position: static;
  transform: none;
  flex: 0 0 auto;
  width: 15px;
  height: 15px;
  font-size: 9px;
  line-height: 13px;
  opacity: 0.75;
  margin: 0;
}
.budget-bar.TIGHT { background: transparent; border-bottom-color: rgba(92, 77, 29, 0.45); }
.budget-bar.TIGHT strong { color: var(--yellow); font-weight: 700; }
.budget-bar.TIGHT .budget-track > i { background: var(--yellow); }
.budget-bar.STOP { background: transparent; border-bottom-color: rgba(138, 48, 64, 0.5); }
.budget-bar.STOP strong, .budget-bar.STOP b { color: var(--red); font-weight: 700; }
.budget-bar.STOP .budget-track > i { background: var(--red); }
.budget-bar.STOP span, .budget-bar.BANK span { white-space: normal; }
.budget-bar.BANK { background: transparent; border-bottom-color: rgba(92, 77, 29, 0.45); }
.budget-bar.BANK strong, .budget-bar.BANK b { color: var(--yellow); font-weight: 700; }
.budget-bar.BANK .budget-track > i { background: var(--yellow); }
.train-mini {
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 10px;
  padding: 0;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
  opacity: 0.75;
}
.train-mini.on { color: var(--yellow); opacity: 1; }
.teach { position: relative; }
.tip-btn {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1px solid var(--yellow);
  background: var(--yellow-bg);
  color: var(--yellow);
  font-size: 11px;
  font-weight: 700;
  line-height: 16px;
  padding: 0;
  cursor: pointer;
  z-index: 1;
}
.cell.teach { padding-right: 20px; }
.cell .tip-btn { top: 2px; right: 2px; }
.teach.lit, .budget-bar.lit { outline: 2px solid var(--yellow); outline-offset: 2px; }
.tip-btn.lit {
  background: var(--yellow);
  color: #1a1408;
  box-shadow: 0 0 0 3px rgba(255, 212, 99, 0.25);
}
.train-banner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px 12px;
  flex-wrap: nowrap;
  background: transparent;
  border: 0;
  border-bottom: 1px solid rgba(230, 195, 92, 0.28);
  border-radius: 0;
  padding: 3px 14px 4px;
  margin: 0 0 4px;
  font-size: 11px;
  color: var(--yellow);
  line-height: 1.2;
}
.train-banner > span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  opacity: 0.9;
}
.train-banner-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.train-banner-sep {
  color: var(--muted);
  opacity: 0.65;
}
.train-banner .text-link {
  border: 0;
  background: transparent;
  padding: 0;
  margin: 0;
  font: inherit;
  font-size: 11px;
  font-weight: 600;
  color: var(--yellow);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
  white-space: nowrap;
}
.train-banner .text-link:hover,
.train-banner .text-link:focus-visible {
  color: var(--text);
  outline: none;
}
.train-switch {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  margin-top: 12px;
}
.train-switch button {
  background: transparent;
  border: 0;
  padding: 8px 14px;
  color: var(--muted);
  cursor: pointer;
}
.train-switch button.on { background: var(--yellow-bg); color: var(--yellow); }
.train-switch.compact { margin-top: 4px; }
.train-switch.compact button { padding: 4px 10px; font-size: 11px; }
#coach {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px 12px 88px;
}
#coach[hidden] { display: none !important; }
.coach-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.5); }
.coach-card {
  position: relative;
  width: min(440px, 100%);
  max-height: min(78vh, 640px);
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--panel);
  border: 1px solid var(--yellow);
  border-radius: 14px;
  padding: 16px 36px 14px 16px;
  z-index: 1;
  box-shadow: var(--shadow);
}
.coach-card h3 { margin: 0 0 10px; font-size: 16px; }
.coach-card p { margin: 0 0 8px; font-size: 13px; line-height: 1.45; }
.coach-card p b { color: var(--yellow); }
.coach-words {
  margin: 10px 0 4px;
  padding: 10px 10px 8px;
  border-radius: 10px;
  background: var(--panel-2);
  border: 1px solid rgba(255, 255, 255, 0.06);
}
.coach-words p { margin: 0 0 6px; }
.coach-words ul {
  margin: 0;
  padding: 0 0 0 16px;
  display: grid;
  gap: 6px;
}
.coach-words li {
  font-size: 12px;
  line-height: 1.4;
  color: var(--text);
}
.coach-x {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 8px;
  background: var(--panel-2);
  color: var(--muted);

#watchlist-root {
  position: fixed;
  inset: 0;
  z-index: 90;
  pointer-events: none;
}
#watchlist-root[hidden] { display: none !important; }
#watchlist-root.on { pointer-events: auto; }
.watchlist-scrim {
  position: absolute;
  inset: 0;
  background: rgba(5, 10, 20, 0.72);
  opacity: 0;
  transition: opacity 0.2s;
}
#watchlist-root.on .watchlist-scrim { opacity: 1; }
.watchlist-sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  max-height: 78vh;
  height: auto;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, #1a2744, #121c33);
  border-top: 1px solid var(--line);
  border-radius: 16px 16px 0 0;
  padding: 10px 10px 14px;
  transform: translateY(110%);
  transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.2, 1), max-height 0.22s ease, border-radius 0.22s ease;
  box-shadow: 0 -16px 40px rgba(0, 0, 0, 0.45);
}
.watchlist-sheet.full {
  max-height: 100%;
  height: 100%;
  border-radius: 0;
  padding-top: max(10px, env(safe-area-inset-top, 0px));
}
#watchlist-root.on .watchlist-sheet { transform: translateY(0); }
.watchlist-grab {
  width: 32px;
  height: 3px;
  border-radius: 99px;
  background: var(--line);
  margin: 0 auto 8px;
}
.watchlist-sheet.full .watchlist-grab { display: none; }
.watchlist-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.watchlist-head h2 {
  margin: 0;
  font-size: 13px;
  font-weight: 750;
  letter-spacing: 0.02em;
  display: flex;
  align-items: baseline;
  gap: 6px;
  flex-wrap: wrap;
}
.wl-seats {
  font-size: 10px;
  font-weight: 650;
  color: var(--muted);
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
}
.wl-seats.warn { color: var(--yellow); }
.watchlist-head-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 0 0 auto;
}
.watchlist-expand,
.watchlist-x {
  border: 0;
  background: var(--panel-2);
  color: var(--muted);
  width: 24px;
  height: 24px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 12px;
  line-height: 1;
  flex: 0 0 auto;
}
.watchlist-expand.on {
  color: var(--accent);
  background: rgba(61, 125, 255, 0.18);
}
.watchlist-x { font-size: 15px; }
.wl-mode-tabs {
  display: flex;
  gap: 2px;
  margin-bottom: 6px;
  padding: 2px;
  border-radius: 9px;
  background: rgba(0, 0, 0, 0.22);
  border: 1px solid var(--line);
}
.wl-mode-tabs button {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 7px;
  padding: 5px 2px;
  font: inherit;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}
.wl-mode-tabs button.on {
  background: rgba(61, 125, 255, 0.28);
  color: var(--text);
}
.wl-mode-tabs button em { display: none; }
.wl-tools {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}
.watchlist-search {
  flex: 1;
  min-width: 0;
  margin: 0;
  padding: 6px 9px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--input);
  color: var(--text);
  font: inherit;
  font-size: 12px;
  box-sizing: border-box;
}
.watchlist-search:focus { border-color: rgba(61, 125, 255, 0.55); outline: none; }
.wl-peek-all {
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid rgba(167, 139, 250, 0.45);
  background: rgba(167, 139, 250, 0.14);
  color: #c4b0ff;
  border-radius: 999px;
  padding: 5px 9px;
  font: inherit;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.wl-peek-all:disabled { opacity: 0.45; cursor: default; }
.wl-peek-all[hidden] { display: none !important; }
.wl-mood {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  margin: 0 0 6px;
}
.wl-mood[hidden] { display: none !important; }
.wl-mood-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--wl-faint, var(--muted));
  margin-right: 2px;
}
.wl-mood button {
  border: 1px solid var(--wl-line, var(--line));
  background: var(--wl-panel-2, var(--panel-2));
  color: var(--wl-muted, var(--muted));
  border-radius: 999px;
  padding: 3px 9px;
  font: inherit;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
}
.wl-mood button.on {
  border-color: rgba(77, 138, 255, 0.5);
  background: rgba(77, 138, 255, 0.18);
  color: #c5d8ff;
}
.wl-legend {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin: 0 0 6px;
  font-size: 9px;
  color: var(--wl-muted, var(--muted));
  letter-spacing: 0.02em;
}
.wl-legend[hidden] { display: none !important; }
.wl-legend i {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 3px;
  vertical-align: middle;
}
.wl-legend .book { background: var(--green); }
.wl-legend .peek { background: #a78bfa; }
.wl-legend .none { background: var(--muted); }
.wl-legend-note { opacity: 0.8; }
.watchlist-toast {
  margin: 4px 0 0;
  min-height: 14px;
  font-size: 10px;
  color: var(--wl-muted, var(--muted));
}
.watchlist-catalog {
  overflow: auto;
  flex: 1;
  min-height: 0;
  display: grid;
  gap: 0;
  padding-right: 2px;
  margin-bottom: 4px;
}

/* —— Scout Strip (Grotesk) —— */
.watchlist-sheet.strip {
  --wl-font: "Space Grotesk", system-ui, sans-serif;
  --wl-mono: "JetBrains Mono", ui-monospace, monospace;
  --wl-text: var(--text);
  --wl-muted: var(--muted);
  --wl-faint: #6a7694;
  --wl-line: var(--line);
  --wl-panel-2: var(--panel-2);
  --wl-input: var(--input);
  --wl-look: #3dcf8e;
  --wl-wait: #e0b84a;
  font-family: var(--wl-font);
  color: var(--wl-text);
}
.watchlist-sheet.strip .watchlist-head h2,
.watchlist-sheet.strip .scout-sym {
  font-family: var(--wl-font);
}
.watchlist-sheet.strip .scout-px,
.watchlist-sheet.strip .scout-chg,
.watchlist-sheet.strip .wl-seats {
  font-family: var(--wl-mono);
}

.watchlist-sheet.strip[data-mood="ink"] {
  background: linear-gradient(180deg, #0e1524 0%, #0a0f18 100%);
}
.watchlist-sheet.strip[data-mood="slate"] {
  background: linear-gradient(180deg, #1c2433 0%, #141a24 100%);
}
.watchlist-sheet.strip[data-mood="paper"] {
  --wl-text: #1a2233;
  --wl-muted: #5a6578;
  --wl-faint: #7a8498;
  --wl-line: #c8d0e0;
  --wl-panel-2: #e8ecf4;
  --wl-input: #f3f5f9;
  --wl-look: #1a8f5c;
  --wl-wait: #b8860b;
  background: linear-gradient(180deg, #f7f5f0 0%, #ebe7df 100%);
  color: var(--wl-text);
  border-top-color: #c8d0e0;
}
.watchlist-sheet.strip[data-mood="paper"] .watchlist-grab { background: #c8d0e0; }
.watchlist-sheet.strip[data-mood="paper"] .wl-mode-tabs {
  background: rgba(0, 0, 0, 0.05);
  border-color: var(--wl-line);
}
.watchlist-sheet.strip[data-mood="paper"] .wl-mode-tabs button { color: var(--wl-muted); }
.watchlist-sheet.strip[data-mood="paper"] .wl-mode-tabs button.on {
  background: rgba(26, 80, 180, 0.12);
  color: #1a50b4;
}
.watchlist-sheet.strip[data-mood="paper"] .watchlist-search {
  background: var(--wl-input);
  border-color: var(--wl-line);
  color: var(--wl-text);
}
.watchlist-sheet.strip[data-mood="paper"] .wl-peek-all,
.watchlist-sheet.strip[data-mood="paper"] .scout-side button.violet {
  color: #5b3db8;
  border-color: rgba(91, 61, 184, 0.35);
  background: rgba(91, 61, 184, 0.08);
}
.watchlist-sheet.strip[data-mood="paper"] .wl-mood button.on {
  border-color: rgba(26, 80, 180, 0.4);
  background: rgba(26, 80, 180, 0.1);
  color: #1a50b4;
}
.watchlist-sheet.strip[data-mood="paper"] .watchlist-expand,
.watchlist-sheet.strip[data-mood="paper"] .watchlist-x {
  background: var(--wl-panel-2);
  color: var(--wl-muted);
}
.watchlist-sheet.strip[data-mood="paper"] .scout-card.strip.selected {
  background: rgba(26, 80, 180, 0.08);
  border-color: rgba(26, 80, 180, 0.25);
}

.scout-card.strip {
  display: grid;
  grid-template-columns: 4px 1fr auto;
  gap: 0 8px;
  align-items: center;
  padding: 5px 6px 5px 0;
  border: 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 0;
  background: transparent;
  text-align: left;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
.watchlist-sheet.strip[data-mood="paper"] .scout-card.strip {
  border-bottom-color: rgba(0, 0, 0, 0.06);
}
.scout-card.strip.peeking { background: rgba(167, 139, 250, 0.08); }
.scout-card.strip.selected {
  background: rgba(77, 138, 255, 0.1);
  border-radius: 8px;
  border-bottom-color: transparent;
}
.scout-rail {
  width: 3px;
  align-self: stretch;
  margin: 2px 0 2px 4px;
  border-radius: 99px;
  background: var(--wl-faint, #6a7694);
}
.scout-card.strip.look .scout-rail {
  background: var(--wl-look, var(--green));
  box-shadow: 0 0 8px rgba(61, 207, 142, 0.3);
}
.scout-card.strip.wait .scout-rail { background: var(--wl-wait, var(--yellow)); }
.scout-card.strip.na .scout-rail { background: var(--wl-line, var(--line)); }
.scout-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.scout-top {
  display: flex;
  align-items: baseline;
  gap: 7px;
  min-width: 0;
}
.scout-src-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  flex: 0 0 auto;
  align-self: center;
  background: var(--wl-faint, #6a7694);
}
.scout-src-dot.src-book { background: var(--green); }
.scout-src-dot.src-peek { background: #a78bfa; }
.scout-src-dot.src-none { background: var(--wl-faint, #6a7694); }
.scout-card.strip .scout-sym {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.02em;
  flex: 0 0 auto;
}
.scout-card.strip .scout-px {
  font-size: 11px;
  color: var(--wl-muted, var(--muted));
  font-variant-numeric: tabular-nums;
  flex: 0 0 auto;
}
.scout-card.strip .scout-bias {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0;
  border-radius: 0;
  background: transparent;
}
.scout-bias.look { color: var(--wl-look, var(--green)); }
.scout-bias.wait { color: var(--wl-wait, var(--yellow)); background: transparent; }
.scout-bias.na { color: var(--wl-faint, var(--muted)); background: transparent; }
.scout-bias.go { color: var(--wl-look, var(--green)); } /* legacy */
.scout-card.strip .scout-chg {
  margin-left: auto;
  font-size: 11px;
  color: var(--wl-muted, var(--muted));
  font-variant-numeric: tabular-nums;
}
.scout-chg.up { color: var(--green); }
.scout-chg.dn { color: var(--red); }
.scout-side {
  display: flex;
  align-items: center;
  padding-right: 2px;
}
.scout-side button {
  border: 1px solid rgba(167, 139, 250, 0.35);
  background: rgba(167, 139, 250, 0.12);
  color: #d4c4ff;
  border-radius: 8px;
  padding: 3px 7px;
  font: inherit;
  font-size: 9px;
  font-weight: 700;
  cursor: pointer;
}
.scout-side button:disabled { opacity: 0.45; cursor: default; }
.scout-card.strip .scout-acts {
  display: flex;
  gap: 6px;
  margin: 0;
  padding-top: 2px;
  flex-wrap: wrap;
}
.scout-card.strip .scout-acts button {
  border: 1px solid var(--wl-line, var(--line));
  background: var(--wl-panel-2, var(--panel-2));
  color: var(--wl-muted, var(--muted));
  border-radius: 8px;
  padding: 4px 9px;
  font: inherit;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
}
.scout-card.strip .scout-acts button.primary {
  border-color: rgba(77, 138, 255, 0.45);
  background: rgba(77, 138, 255, 0.18);
  color: #c5d8ff;
}
.scout-card.strip .scout-acts button:disabled { opacity: 0.45; cursor: default; }
.watchlist-sheet.strip .watchlist-search {
  font-family: var(--wl-font);
}
.watchlist-adv {
  margin-top: 4px;
  font-size: 11px;
  color: var(--wl-muted, var(--muted));
}
.watchlist-adv summary { cursor: pointer; }
.wl-card {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 10px;
  align-items: center;
  padding: 9px 10px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(14, 23, 48, 0.75);
  cursor: pointer;
  text-align: left;
  color: inherit;
  font: inherit;
}
.wl-card.on {
  border-color: rgba(61, 125, 255, 0.5);
  background: rgba(61, 125, 255, 0.12);
}
.wl-card.in-lib {
  border-color: rgba(61, 207, 142, 0.28);
}
.wl-card.core { border-color: rgba(61, 207, 142, 0.28); }
.wl-card:disabled { opacity: 0.45; cursor: not-allowed; }
.wl-sym { font-size: 14px; font-weight: 750; letter-spacing: 0.02em; }
.wl-name { font-size: 11px; color: var(--muted); }
.wl-id {
  grid-column: 1 / -1;
  font-size: 9px;
  color: var(--muted);
  opacity: 0.8;
  font-family: ui-monospace, Consolas, monospace;
}
.wl-badge {
  font-size: 9px;
  font-weight: 700;
  padding: 3px 7px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
  white-space: nowrap;
  justify-self: end;
}
.wl-badge.pin {
  color: #b6ccff;
  border-color: rgba(61, 125, 255, 0.45);
  background: rgba(61, 125, 255, 0.15);
}
.wl-badge.lib {
  color: var(--green);
  border-color: rgba(61, 207, 142, 0.35);
  background: rgba(61, 207, 142, 0.1);
}
.wl-badge.find {
  color: #d4c4ff;
  border-color: rgba(167, 139, 250, 0.4);
  background: rgba(167, 139, 250, 0.1);
}
.wl-tog {
  width: 38px;
  height: 22px;
  border-radius: 999px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  position: relative;
  flex: 0 0 auto;
}
.wl-card.on .wl-tog {
  background: rgba(61, 125, 255, 0.35);
  border-color: rgba(61, 125, 255, 0.55);
}
.wl-tog::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--muted);
  transition: transform 0.15s, background 0.15s;
}
.wl-card.on .wl-tog::after {
  transform: translateX(16px);
  background: #fff;
}
.watchlist-adv {
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  padding-top: 10px;
}
.watchlist-adv summary {
  cursor: pointer;
  font-size: 11px;
  font-weight: 650;
  color: var(--muted);
  list-style: none;
}
.watchlist-adv summary::-webkit-details-marker { display: none; }
.watchlist-adv-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-top: 8px;
}
.watchlist-adv-grid label {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 10px;
  color: var(--muted);
}
.watchlist-adv-grid input {
  background: var(--input);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 8px;
  color: var(--text);
  font: inherit;
  font-size: 12px;
}
.watchlist-adv-grid .full { grid-column: 1 / -1; }
.watchlist-toast {
  margin: 8px 0 0;
  font-size: 11px;
  color: var(--yellow);
  min-height: 1.2em;
}

.spark { width: 118px; height: 36px; display: block; flex: 0 0 auto; }
.chg-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chg-row span,
.chg-row .chg-link {
  background: var(--panel-2);
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 11px;
  color: var(--muted);
  border: 1px solid transparent;
  font: inherit;
  cursor: pointer;
}
.chg-row span.up,
.chg-row .chg-link.up { color: var(--green); }
.chg-row span.down,
.chg-row .chg-link.down { color: var(--red); }
.range-meter { margin-top: 10px; }
.range-meter .track {
  height: 7px;
  border-radius: 99px;
  background: linear-gradient(90deg, #3dcf8e 0%, #3dcf8e 28%, #e6c35c 50%, #ff6b7a 75%, #ff6b7a 100%);
  position: relative;
}
.range-meter.high .cap span:nth-child(2) { color: var(--red); }
.range-meter.low .cap span:nth-child(2) { color: var(--green); }
.range-meter .dot {
  position: absolute;
  top: -3px;
  width: 13px;
  height: 13px;
  margin-left: -6px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 0 2px var(--bg);
}
.range-meter .cap {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 10px;
  color: var(--muted);
  margin-top: 6px;
}
.setup-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 10px 10px;
}
.setup-card p { margin: 0 0 6px; font-size: 12px; }
.setup-card .btn { padding: 7px 10px; font-size: 12px; }
.updates-entry p { margin: 0 0 10px; color: var(--muted); font-size: 13px; line-height: 1.4; }
.updates-screen .update-when { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
.updates-screen ul { margin: 0; padding-left: 18px; }
.updates-screen li { margin: 0 0 6px; font-size: 13px; line-height: 1.4; }

.page-market .budget-bar {
  padding: 2px 10px;
  gap: 5px;
}
.page-market .budget-track { flex: 0 0 22px; }
.page-market .budget-bar span { font-size: 10px; max-width: 38vw; }
.page-sizer main,
.page-market main { padding: 10px 12px 20px; }
.market-screen { display: flex; flex-direction: column; gap: 4px; max-width: 560px; }
.market-screen .coin-row { margin: 0; }
.market-mega { margin: 0; }
.market-mega .sizer-mega-fresh {
  font-size: 10px;
  max-width: 36%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.market-board {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 10px;
}
.market-board-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.market-bias label,
.market-score label,
.market-now label {
  display: block;
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.market-bias b {
  display: block;
  font-size: 15px;
  line-height: 1.2;
  margin-top: 1px;
  font-weight: 700;
}
.market-board.MIXED .market-bias b { color: var(--yellow); }
.market-board.UNFAVOURABLE .market-bias b { color: var(--red); }
.market-board.FAVOURABLE .market-bias b { color: var(--green); }
.market-score { text-align: right; min-width: 64px; }
.market-score b {
  display: block;
  font-size: 15px;
  line-height: 1.2;
  color: var(--green);
  font-weight: 700;
}
.market-board.MIXED .market-score b { color: var(--yellow); }
.market-board.UNFAVOURABLE .market-score b,
.market-score.hot b { color: var(--red); }
.market-score small {
  display: block;
  margin-top: 1px;
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--muted);
}
.market-score-bar {
  height: 5px;
  margin: 4px 0 2px;
}
.market-reason {
  margin: 0 0 4px;
  font-size: 11px;
  color: var(--muted);
  line-height: 1.3;
}
.market-swing-block {
  margin: 0 0 6px;
  padding: 4px 6px 3px;
  border-radius: 8px;
  background: var(--panel-2);
  border: 1px solid rgba(255, 255, 255, 0.05);
  position: relative;
}
.market-swing-block.lo {
  background: var(--green-bg);
  border-color: rgba(61, 207, 142, 0.22);
}
.market-swing-block.lo .market-swing { color: var(--green); }
.market-swing-block.hi {
  background: var(--red-bg);
  border-color: rgba(255, 107, 122, 0.22);
}
.market-swing-block.hi .market-swing { color: var(--red); }
.market-swing-block.fail {
  background: var(--yellow-bg);
  border-color: rgba(230, 195, 92, 0.28);
}
.market-swing-block.fail .market-swing { color: var(--yellow); }
.market-swing-block > .tip-btn,
.teach:has(.market-swing-block) > .tip-btn {
  top: 2px;
  right: 2px;
}
.market-swing {
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  font-size: 10px;
  line-height: 1.25;
  color: var(--muted);
  font-weight: 650;
  flex: 1 1 auto;
  min-width: 0;
}
.market-swing-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px 10px;
  flex-wrap: wrap;
  margin: 0 0 4px;
  padding-right: 2px;
}
.market-swing-head > .teach {
  position: relative;
  flex: 0 0 auto;
  margin: 0;
  padding-right: 14px;
}
.market-swing-head > .teach > .tip-btn {
  top: 50%;
  right: -2px;
  transform: translateY(-50%);
}
.swing-layers {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: 0;
  justify-content: flex-end;
}
.swing-layer {
  display: inline-flex;
  align-items: center;
  padding: 1px 6px;
  border-radius: 999px;
  font-size: 8px;
  font-weight: 650;
  letter-spacing: 0.03em;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--muted);
}
.swing-layer.backdrop {
  color: var(--yellow);
  border-color: rgba(230, 195, 92, 0.35);
  background: rgba(51, 44, 18, 0.45);
}
.swing-layer.scalp {
  color: var(--green);
  border-color: rgba(61, 207, 142, 0.35);
  background: rgba(18, 53, 38, 0.4);
}
.teach:has(.swing-layers) { position: relative; }
.teach:has(.swing-layers) > .tip-btn {
  top: -2px;
  right: 0;
}
.market-swing-head > .teach:has(.swing-layers) > .tip-btn {
  top: 50%;
  right: -2px;
  transform: translateY(-50%);
}
.swing-zone-tip {
  display: inline;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  font-weight: 700;
  color: inherit;
  cursor: pointer;
  text-decoration: none;
  border-bottom: 1px dotted currentColor;
  border-radius: 0;
}
.swing-zone-tip.fail { color: var(--yellow); }
.swing-zone-tip.lo { color: var(--green); }
.swing-zone-tip.hi { color: var(--red); }
.swing-zone-tip:focus-visible {
  outline: 1px solid var(--accent);
  outline-offset: 2px;
}
.swing-zone-tip.on {
  border-bottom-style: solid;
}
.market-swing-empty {
  margin: 2px 0 0;
  font-size: 10px;
  color: var(--yellow);
}
.horizons-block {
  margin: 0 0 6px;
}
.horizons-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: 0 0 3px;
  align-items: center;
}
.horizon-pill {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  max-width: 100%;
  text-align: left;
  border: 1px solid var(--line);
  background: var(--panel-2);
  border-radius: 999px;
  padding: 2px 8px 2px 7px;
  cursor: pointer;
  color: inherit;
  font: inherit;
  line-height: 1.2;
}
.horizon-pill .horizon-k {
  font-size: 8px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 650;
}
.horizon-pill .horizon-v {
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 11em;
}
.horizon-pill.up {
  border-color: rgba(61, 207, 142, 0.35);
  background: rgba(18, 53, 38, 0.35);
}
.horizon-pill.up .horizon-v { color: var(--green); }
.horizon-pill.dn {
  border-color: rgba(255, 107, 122, 0.35);
  background: rgba(58, 21, 32, 0.35);
}
.horizon-pill.dn .horizon-v { color: var(--red); }
.horizon-pill.mid {
  border-color: rgba(230, 195, 92, 0.35);
  background: rgba(51, 44, 18, 0.4);
}
.horizon-pill.mid .horizon-v { color: var(--yellow); }
.horizon-pill.on,
.horizon-pill:focus-visible {
  outline: 1px solid rgba(61, 125, 255, 0.55);
  outline-offset: 1px;
}
.horizons-coach {
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  font-size: 10px;
  line-height: 1.3;
  color: var(--muted);
}
.horizons-coach span {
  color: var(--yellow);
  font-weight: 650;
  letter-spacing: 0.02em;
}

/* Pill ↔ board link (Market) */
.board-mark {
  transition: opacity 0.18s, filter 0.18s, box-shadow 0.18s, outline-color 0.18s;
  cursor: pointer;
}
.board-mark.dim {
  opacity: 0.38;
  filter: saturate(0.55);
}
.board-mark.lit {
  outline: 2px solid rgba(61, 125, 255, 0.65);
  outline-offset: 2px;
  box-shadow: 0 0 18px rgba(61, 125, 255, 0.28);
  opacity: 1;
  filter: none;
  position: relative;
  z-index: 2;
}
.board-mark.pulse {
  animation: boardMarkPulse 0.9s ease-out 2;
}
@keyframes boardMarkPulse {
  0%, 100% { outline-color: rgba(61, 125, 255, 0.5); }
  50% { outline-color: rgba(61, 125, 255, 0.95); box-shadow: 0 0 26px rgba(61, 125, 255, 0.45); }
}
.pill-tip.board-lit,
.horizon-pill.board-lit,
.chg-link.board-lit,
.swing-zone-tip.board-lit {
  box-shadow: 0 0 0 2px rgba(61, 125, 255, 0.55), 0 0 14px rgba(61, 125, 255, 0.3);
  position: relative;
  z-index: 2;
}
.pill-tip.pulse,
.horizon-pill.pulse,
.chg-link.pulse {
  animation: pillBoardPulse 0.9s ease-out 2;
}
@keyframes pillBoardPulse {
  0%, 100% { box-shadow: 0 0 0 2px rgba(61, 125, 255, 0.45); }
  50% { box-shadow: 0 0 0 4px rgba(61, 125, 255, 0.12), 0 0 20px rgba(61, 125, 255, 0.5); }
}
.swing-pivot-hit.board-lit::before,
.swing-now-hit.board-lit::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(61, 125, 255, 0.7), 0 0 14px rgba(61, 125, 255, 0.5);
  animation: boardMarkRing 0.85s ease-out 2;
  pointer-events: none;
}
@keyframes boardMarkRing {
  0% { transform: scale(0.85); opacity: 1; }
  100% { transform: scale(1.45); opacity: 0; }
}
.swing-now-hit {
  position: absolute;
  width: 28px;
  height: 28px;
  margin: -14px 0 0 -14px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  z-index: 3;
  padding: 0;
}
.market-metrics .metric-mark,
.sizer-metrics .metric-mark {
  width: 100%;
  text-align: left;
  border: 0;
  background: inherit;
  color: inherit;
  font: inherit;
  padding: 0;
  margin: 0;
}
.market-lvls .board-mark {
  display: block;
}
.market-bias.board-mark,
.market-score.board-mark,
.market-now.board-mark,
.range-meter.board-mark {
  border-radius: 10px;
}
.cone-tools .board-mark.on.lit {
  outline-offset: 1px;
}
.cone-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px 8px;
  margin: 0 0 5px;
}
.cone-tools > span {
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 650;
}
.cone-tools button {
  border: 1px solid var(--line);
  background: var(--input);
  color: var(--muted);
  border-radius: 999px;
  padding: 2px 8px;
  font: inherit;
  font-size: 10px;
  font-weight: 650;
  cursor: pointer;
}
.cone-tools button.on {
  color: #c8d4f0;
  border-color: rgba(148, 163, 184, 0.45);
  background: rgba(148, 163, 184, 0.12);
}
.cone-tools .cone-what {
  margin-left: auto;
  border: 0;
  background: transparent;
  color: var(--muted);
  text-decoration: underline;
  text-underline-offset: 2px;
  padding: 0 2px;
  font-size: 10px;
  font-weight: 550;
}
.cone-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  margin: 4px 0 2px;
  font-size: 10px;
  color: var(--muted);
}
.cone-legend i {
  display: inline-block;
  width: 16px;
  height: 3px;
  border-radius: 2px;
  margin-right: 4px;
  vertical-align: middle;
}
.cone-legend .past { background: var(--green); }
.cone-legend .cone {
  background: linear-gradient(90deg, rgba(148, 163, 184, 0.55), rgba(148, 163, 184, 0.15));
}
.cone-legend .midline {
  background: repeating-linear-gradient(90deg, #94a3b8 0 3px, transparent 3px 6px);
}
.swing-spark {
  margin: 0;
  line-height: 0;
  position: relative;
}
.swing-spark svg {
  display: block;
  width: 100%;
  height: 112px;
  border-radius: 4px;
  background: transparent;
}
.swing-spark.has-cone svg {
  background: #0a1220;
  border-radius: 8px;
}
.swing-pivot-hit {
  position: absolute;
  width: 30px;
  height: 30px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  transform: translate(-50%, -50%);
  cursor: pointer;
  z-index: 3;
  -webkit-tap-highlight-color: transparent;
}
.swing-pivot-hit::after {
  content: "";
  position: absolute;
  inset: 6px;
  border-radius: 50%;
  border: 1.5px solid transparent;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}
.swing-pivot-hit.lo.on::after {
  border-color: rgba(61, 207, 142, 0.55);
  box-shadow: 0 0 0 3px rgba(61, 207, 142, 0.12);
}
.swing-pivot-hit.hi.on::after {
  border-color: rgba(255, 107, 122, 0.55);
  box-shadow: 0 0 0 3px rgba(255, 107, 122, 0.12);
}
.swing-pivot-label {
  position: absolute;
  z-index: 4;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transform: translate(10px, -118%) scale(0.96);
  transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
}
.swing-pivot-label.is-on {
  opacity: 1;
  visibility: visible;
}
.swing-pivot-label.start.above { transform: translate(10px, -118%) scale(0.96); }
.swing-pivot-label.start.below { transform: translate(10px, 10px) scale(0.96); }
.swing-pivot-label.end.above { transform: translate(calc(-100% - 10px), -118%) scale(0.96); }
.swing-pivot-label.end.below { transform: translate(calc(-100% - 10px), 10px) scale(0.96); }
.swing-pivot-label.above:not(.start):not(.end) { transform: translate(10px, -118%) scale(0.96); }
.swing-pivot-label.below:not(.start):not(.end) { transform: translate(10px, 10px) scale(0.96); }
.swing-pivot-label.is-on.start.above,
.swing-pivot-label.is-on.above:not(.start):not(.end) { transform: translate(10px, -118%) scale(1); }
.swing-pivot-label.is-on.start.below,
.swing-pivot-label.is-on.below:not(.start):not(.end) { transform: translate(10px, 10px) scale(1); }
.swing-pivot-label.is-on.end.above { transform: translate(calc(-100% - 10px), -118%) scale(1); }
.swing-pivot-label.is-on.end.below { transform: translate(calc(-100% - 10px), 10px) scale(1); }
.swing-pivot-flyout {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 5px 9px 6px;
  border-radius: 9px;
  background: linear-gradient(160deg, rgba(22, 32, 52, 0.94), rgba(11, 18, 32, 0.9));
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow:
    0 8px 20px rgba(0, 0, 0, 0.38),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  line-height: 1.05;
  white-space: nowrap;
}
.swing-pivot-flyout em {
  font-style: normal;
  font-size: 7.5px;
  font-weight: 650;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.72;
}
.swing-pivot-flyout b {
  font-size: 12px;
  font-weight: 650;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.swing-pivot-when {
  font-size: 8px;
  font-weight: 550;
  letter-spacing: 0.02em;
  color: rgba(200, 210, 230, 0.72);
  margin-top: 1px;
}
.swing-pivot-label.lo .swing-pivot-flyout {
  border-color: rgba(61, 207, 142, 0.22);
}
.swing-pivot-label.lo .swing-pivot-flyout em { color: #9fe8c4; }
.swing-pivot-label.lo .swing-pivot-flyout b { color: var(--green); }
.swing-pivot-label.hi .swing-pivot-flyout {
  border-color: rgba(255, 107, 122, 0.22);
}
.swing-pivot-label.hi .swing-pivot-flyout em { color: #ffb0b8; }
.swing-pivot-label.hi .swing-pivot-flyout b { color: var(--red); }
.swing-tf {
  position: absolute;
  left: 3px;
  bottom: 2px;
  font-size: 7px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--muted);
  opacity: 0.7;
  pointer-events: none;
  line-height: 1;
}
.market-now {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 8px;
}
.market-now b { font-size: 18px; line-height: 1; font-weight: 700; }
.market-now small { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); }
.market-now small.up { color: var(--green); }
.market-now small.down { color: var(--red); }
.market-now .spark { width: 88px; height: 24px; }
.market-screen .chg-row { margin-top: 4px; gap: 4px; }
.market-screen .chg-row span,
.market-screen .chg-row .chg-link {
  padding: 2px 6px;
  font-size: 10px;
  border-radius: 6px;
}
.market-screen .range-meter { margin-top: 4px; }
.market-screen .range-meter .track { height: 6px; }
.market-screen .range-meter .dot { width: 11px; height: 11px; top: -2.5px; }
.market-screen .range-meter .cap { margin-top: 3px; font-size: 10px; }
.market-lvls {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 4px;
  margin-top: 4px;
}
.market-lvls span {
  display: flex;
  flex-direction: column;
  gap: 0;
  padding: 3px 6px;
  border-radius: 8px;
  background: var(--panel-2);
  border: 1px solid rgba(255, 255, 255, 0.04);
}
.market-lvls i {
  font-style: normal;
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.market-lvls b { font-size: 12px; font-weight: 700; }
.market-metrics {
  margin-top: 4px;
  grid-template-columns: 1fr 1fr !important;
  gap: 4px !important;
}
.market-metrics > div,
.market-metrics > .teach > div,
.market-metrics .metric-mark {
  padding: 4px 6px !important;
  border-radius: 8px;
}
.market-metrics label { font-size: 10px !important; }
.market-metrics b { font-size: 13px !important; }
.market-frame {
  margin: 4px 0 0;
  font-size: 11px;
  color: var(--muted);
  line-height: 1.3;
}
.market-send {
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 8px;
}
.market-send p {
  margin: 0;
  flex: 1 1 160px;
  font-size: 11px;
  line-height: 1.35;
  color: var(--muted);
}
.market-send .btn {
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 650;
  border-radius: 999px;
  margin: 0;
}
.market-adjust-note { margin: 6px 0 0; font-size: 11px; }
.market-screen .help,
.market-screen .sizer-vol { margin: 0; }
.market-screen .help summary,
.market-screen .sizer-vol > summary {
  font-size: 11px;
  color: var(--muted);
  padding: 2px 0;
}
.market-screen .sizer-metrics div.warn,
.market-screen .market-metrics div.warn { background: var(--red-bg); }
.market-screen .sizer-metrics div.warn b,
.market-screen .market-metrics div.warn b { color: var(--red); }
.market-screen .sizer-metrics div.mid,
.market-screen .market-metrics div.mid { background: var(--yellow-bg); }
.market-screen .sizer-metrics div.mid b,
.market-screen .market-metrics div.mid b { color: var(--yellow); }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; padding-bottom: 76px; }
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto; height: auto;
    flex-direction: row; justify-content: space-around; padding: 8px;
    border-right: 0; border-top: 1px solid var(--line); z-index: 5;
  }
  .brand, .nav-spacer, .nav-train { display: none; }
  .nav button { flex: 1; text-align: center; font-size: 12px; padding: 10px 4px; }
  .nav-wide { display: none; }
  .nav-narrow { display: inline; }
  #coach { align-items: flex-end; }
  .nav button.active { box-shadow: inset 0 -3px 0 var(--accent); }
  main { padding: 10px 12px 20px; }
  #budget { padding: 0; background: var(--bg); }
  .budget-bar { padding: 2px 12px; gap: 5px; }
  .budget-track { flex-basis: 24px; }
  .sizer-toolbar { gap: 6px; }
  .sizer-fresh { margin: 1px 0 6px; }
  .grid.two, .grid.three, .groups { grid-template-columns: 1fr; }
  .cluster-row.cols-4 { grid-template-columns: 1fr 1fr; }
  .grid.stats, .closes-grid { grid-template-columns: 1fr 1fr; }
  .page-head { flex-direction: column; }
  .sizer-screen, .market-screen { min-height: calc(100dvh - 92px); }
  .spark { width: 96px; }
  .close-row { grid-template-columns: 1fr 1fr 1fr; }
  .close-row input { grid-column: 1 / -1; }
}

/* Integrated hourly context: no separate dashboard or new hard-gate badges. */
.context-chart{width:100%;margin:12px 0}.context-chart svg{width:100%;height:auto;display:block;max-height:300px}
.context-legend{display:flex;flex-wrap:wrap;gap:5px 13px;font:10px/1.6 system-ui;color:var(--muted)}
.context-chart-detail{font:11px/1.6 system-ui;color:var(--muted);margin-top:10px}
.context-summary,.context-rule,.context-risk{font:12px/1.65 system-ui;margin:12px 0;color:var(--text)}
.context-rule{border-top:1px solid var(--line);padding-top:10px}.context-risk{color:var(--muted)}
.context-explanation{padding:12px 0;border-top:1px solid var(--line);font:12px/1.7 system-ui}
.context-explanation h4{margin:0 0 8px}.context-explanation small,.context-unavailable{color:var(--muted);font:11px/1.6 system-ui}

/* Keep the original pivot hit targets aligned with the restored chart. */
.context-chart.restored-swing .swing-spark svg{height:220px!important;max-height:none;display:block}
.context-chart.restored-swing .swing-spark{line-height:0}
.context-chart.restored-swing .cone-tools{flex-wrap:wrap}
.context-chart.restored-swing .cone-tools button:disabled{opacity:.4;cursor:not-allowed}
.cone-disclaimer{font:11px/1.6 system-ui;color:var(--muted);margin:10px 0}
.context-chart .swing-pivot-flyout{max-width:210px}

.library-header{display:flex;justify-content:space-between;align-items:center}.library-header h2{font-size:18px;margin:0}.library-header p{font-size:11px;color:#91a7c2;margin:5px 0}
.library-close{background:#203047;border:0;border-radius:50%;width:32px;height:32px;font-size:23px;color:#c7d6e7}

/* LR1 — layout reclaim. Measured on the real app at 390x844 on 21 Sep 2026: the rules below are the
   exact CSS that was measured, not a hand-written approximation. Nothing here touches a financial gate,
   the account lock, sizing, Journal/sync, the fixed Entry or the guarded Review+Apply path. */

/* Rhythm: one spacing scale, same on both working screens. */
.cd-header{padding:9px 10px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0}
.cd-decision{padding:8px 0;border-bottom:0}
.cd-card{padding:9px 0;background:transparent;border:0;border-radius:0}
.cd-card > header{margin-bottom:7px}
.cr-lead,.pc-card{padding:7px 0;margin:0;border-top:1px solid var(--line)}
.cd-timeframes{gap:6px;margin:8px 0}
.cd-strip{gap:5px}
.cd-chart{margin:8px 0 0}
.cd-chart-tools{margin-bottom:6px}
.cd-fold{margin:8px 0 0;border:0;background:transparent}
.cr-strip{margin:7px 0}
.cch-bar{padding:0 8px 5px;gap:5px}
.cch-tags{padding:0 8px;gap:5px}
.cch-read{margin:5px 8px 0;font-size:12px;line-height:1.45}
.cch-sum{margin:5px 2px 0;font-size:12px}
.cd-warning{padding:6px 9px;line-height:1.45!important}
.market-screen p,.sizer-screen p{margin:5px 0}

/* One row of chart controls instead of two: the zoom / page / Y: buttons now live in the chip row. */
.cch .cch-bar{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent)}
.cch-strip .cch-bar button{padding:6px 9px}
.cch .cch-bar button,.cch .cch-bar .cd-small,.cch .cch-bar .cch-gap{flex:0 0 auto}
.cch .cch-bar button,.cch .cch-ctl button{font-size:14px;padding:6px 11px;min-height:44px}
.cch .cch-bar .cd-small,.cch-cap{font-size:12px}
.cch-cap{color:var(--muted);flex:0 1 auto;padding:0 2px 0 0}
.cch .cch-bar .cch-gap{flex:0 0 12px}
@media(max-width:600px){.cch .cch-bar button{flex:0 0 auto}}

/* Long explanations fold to two lines and open on tap. The words stay in the DOM. */
.foldp{position:relative;cursor:pointer}
.foldp:not(.foldp-open){display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foldp.f1:not(.foldp-open){-webkit-line-clamp:1}
.foldp:not(.foldp-open)::after{content:"… ▾";position:absolute;right:0;bottom:0;padding:0 4px 0 9px;background:var(--bg);color:#9fb0cc;font-size:12px;line-height:1.5}
.foldp:focus-visible{outline:2px solid #ffd66b;outline-offset:2px;border-radius:6px}

/* Legibility floor. Sizes are listed per selector rather than ruled over the whole app on purpose: a
   blanket minimum reflowed the dense Library rows and the horizon pills. Every one of these was found by
   measuring, and 9px / 8px text on the working screens is the worst of what the sweep turned up. */
.cd-small,small,.cch-read,.cch-sum,.pc-card p,.cr-note,.cr-sub,.market-adjust-note{font-size:12px!important}
.text-link,.tag{min-height:40px}
.tag{font-size:12px}
.swing-tf,.watch b,.watch small{font-size:12px!important}
.cd-strip button span,.cd-strip button b,.trend-three b{font-size:12px}
.horizon-k,.horizon-v,.swing-layer{font-size:11px}
#main .cd-chart-tools button,#main .cone-tools button,#main .cone-tools span,#main .range-meter .cap span{font-size:12px!important}   /* the chart's own tool rows carry their own sizes, so the floor has to out-specify them */
.sizer-hero label{font-size:12px!important}
.swing-pivot-flyout,.swing-pivot-flyout em,.swing-pivot-when,.trend-three label,.continuation-compare header span,.continuation-compare label,.cluster-tag,.horizon-k,.horizon-v{font-size:11px!important}   /* !important: these rows are each styled per element, and one floor has to win everywhere at once */
/* the two most tapped things in the app: the bottom nav and the R-target picker */
.nav button{min-height:40px}
@media(max-width:760px){.app{padding-bottom:88px}}
.rr-btn{min-height:36px}
.stepper button{min-height:32px}
/* the corner ⓘ is a real 40px target now; its container steps aside so it cannot sit on the heading */
.tip-btn{width:40px;height:40px;min-width:40px;min-height:40px}
.teach:has(> .tip-btn),.cell:has(> .tip-btn),.market-swing-head:has(.tip-btn),.market-swing-block:has(> .tip-btn),.budget-bar:has(.tip-btn),.cd-card > header:has(.tip-btn){padding-right:46px}

/* --- the rest of the floor (LR1.1, 21 Sep 2026): every real control at 40px, and the chart's own
   labels at 12px with the gutter widened to hold them. Most of these rows were pinned by an explicit
   height rather than a min-height, so height:auto comes with the floor or the min-height is ignored.
   The exclusions are chart annotations, not controls, and each one is measured: the swing dots sit
   15px apart at their closest on a phone (40px squares would overlap and make a tap ambiguous), and the
   journal's now-marker is a 12px point on a bar. Everything you can actually press is on the floor. --- */
#main button:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow):not(.mp-btn):not(.more-chip):not(.more-info):not(.more-palette-option),
#main summary, .train-mini, .stepper button, .rr-btn, .horizon-pill{min-height:40px;height:auto}
details > summary{display:flex;align-items:center;gap:6px}
.horizon-pill{padding:8px 10px}
.train-mini{padding:0 9px}
.cch .cch-ax-l{font-size:12px}
.cch .cch-plot text{font-size:12px}

/* --- nothing under 11px, anywhere (LR1.1, 21 Sep 2026) ---
   The dense Library/Scout rows and the Journal's position meters are kept dense on purpose, but 8px and
   9px are not density, they are unreadable. They come up to 11px, which costs these screens a few px and
   nothing on Market, where the rows were already at the floor. */
#main .lane-lvl-tag, #main .triage-columns span, #main .triage-scanbar button, #main .triage-scanbar span,
#main .triage-scanner footer, #main .sizer-metrics label, #main .signal-key span, #main .signal-key button,
#main .signal-caps span, #main .live-pl label, #main p.coin-hint,
#main .manage-do-label, #main .manage-facts-label {font-size:11px!important}

/* The chart chips keep LR1's 44px, which is above the floor: the blanket rule above is scoped by an id,
   so it has to be answered here at the same specificity rather than left to lose. */
#main .cch-bar button, #main .cch-tag {min-height:44px!important}
   /* the blanket floor above carries six :not() classes, which out-specifies it, so the 44px chips
      have to be protected here rather than assumed to win */

/* --- CP1 — compact phone (21 Sep 2026, option D from the preview you picked) ---
   Two things at once: the space comes from the gaps and from folding prose to one line (the fold is the app's
   own, so every folded line is a tap away from its full text), and the press targets come down to 28–30px.
   The text floor does NOT move: no rule here touches a font size below 12px except the micro tier LR1 set at
   11px, and nothing in the app goes under 11px. The chart chips and the window pills keep 44px — those are the
   ones you swipe and tap while the chart is moving, and they were not what you asked to shrink. */
#main p.cd-small, #main .cd-plan-reason {margin-top:2px!important;margin-bottom:2px!important}
/* the folded prose is reached through the fold class itself, so no rule here has to name a class the gate
   tiles also use — tests/cr1-store-invariants.cjs forbids that, and it is right to */
#main p.foldp {margin-top:2px!important;margin-bottom:2px!important;line-height:1.35!important}
#main .cluster {margin-top:4px!important;margin-bottom:4px!important}
#main .cd-metrics {margin-top:6px!important;padding-top:6px!important}
#main .cd-actions {margin-top:6px!important;gap:6px!important}
#main .cd-card, #main .cd-decision {padding-top:6px!important;padding-bottom:6px!important}
#main .sizer-screen details, #main .market-screen details {margin-top:6px!important;margin-bottom:6px!important}
   /* scoped on purpose: the Manual has 25 sections whose spacing is set elsewhere, and an unscoped rule
      measured +132px there — it would have handed back everything this block saves */
#main .cd-card > header {margin-bottom:4px!important}
#main .cd-plan h3 {margin-bottom:5px!important}
#main .cd-strip {gap:4px!important}
#main .cd-strip button {padding:3px 6px!important;line-height:1.3;min-height:30px!important}
#main .cd-strip button b {margin-top:0!important;font-size:12px}
#main .cd-strip button span {font-size:12px}
#main .cd-header {padding-top:5px!important;padding-bottom:5px!important}
#main .cd-header-row, #main .coin-navigation {gap:5px!important}
#main .cd-decision {align-items:center!important}
#main .cd-decision > div {min-width:0!important}
#main .cd-decision small {margin-top:1px!important}
#main .cd-verdict {align-self:center!important}
#main .cluster-row.cols-3 > div {padding:3px 6px!important}
#main .cluster-row.cols-3 {font-size:13px!important}
#main .cd-warning {padding:4px 7px!important;margin-top:3px!important;margin-bottom:3px!important}
#main .btn, #main .btn.secondary, #main .btn.danger, #main .text-link {min-height:28px!important;height:auto!important;padding:4px 9px!important;font-size:13px!important}
#main .coin-navigation button {min-height:30px!important;padding:3px 8px!important}
#main details > summary {min-height:30px!important}
#main .cch-bar button, #main .cch-tag {min-height:44px!important}

/* --- SC1 — Scout carries the gate's own words (21 Sep 2026) ---
   One short word and one number are added to a Scout row, taken from the book the row already holds, so the
   yellow Timing tile in Market stops being a surprise. Everything here is presentation: no rule below names a
   gate state, changes a tap target, hides anything, or touches the chart. */

/* The chip and the mid figure are <small> elements, so LR1's blanket `small` floor already holds them at 12px
   with !important: sizing is deliberately left to it rather than fought. What is added here is a tighter
   line-height and a hair of space, and the phone padding gives 3px a side back, which pays for most of the
   added line: rows measure 47px before SC1 and 58px after. */
#main .triage-pos,
#main .triage-mid{line-height:1.35;letter-spacing:.02em;margin-top:1px;color:var(--muted)}
#main .triage-pos.warn{color:var(--yellow)}
/* "ok" is deliberately quiet, not green: green is what a PASS tile means in this app, and a Scout row must
   never look like one. Only the caution gets a colour. */
#main .triage-pos.ok{color:var(--muted)}
#main .triage-mid.over{color:var(--yellow)}
#main .triage-mid.under{color:var(--muted)}
@media(max-width:650px){#main .triage-page .triage-row{padding:6px 9px}
  /* the 24h column has to hold two signed figures, so it borrows 14px from the wide middle cell */
  #main .triage-columns,#main .triage-page .triage-row{grid-template-columns:62px minmax(92px,1fr) 74px}}

/* 8px and 9px are not density. The LOOK/WAIT word in a Library row and the build stamp under the sheet header
   were the last text in the app below the floor; they come up to 11px. The two theme blocks that set them small
   are answered at the same specificity with !important, which is how the rest of the floor survives. */
#main .scout-bias{font-size:11px!important;letter-spacing:.02em}
#main .library-build{font-size:11px!important}

/* The Scout inspector's field labels shipped at 9px on desktop (the phone layout never shows them). Same
   story as the chip: not density, just small. One rule, scoped to the inspector, so no other label moves. */
#main .triage-inspector label{font-size:11px!important}
/* COST1 F1: the break-even small print carries two figures now; keep them inside the tile on a phone. */
.sizer-hero small { overflow-wrap: anywhere; }

/* Market climate — a visible observation layer above the existing Gates. */
.market-screen .market-climate{--climate-tone:var(--muted);--climate-bg:var(--input);padding:14px 15px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,rgba(21,31,53,.98),rgba(15,25,43,.98));min-width:0;box-shadow:0 8px 22px rgba(0,0,0,.14)}
.market-screen .market-climate.climate-good{--climate-tone:var(--green);--climate-bg:var(--green-bg);border-color:#2f6d5a}
.market-screen .market-climate.climate-mid{--climate-tone:var(--yellow);--climate-bg:var(--yellow-bg);border-color:#5a4d27}
.market-screen .market-climate.climate-bad{--climate-tone:var(--red);--climate-bg:var(--red-bg);border-color:#6a3441}
.market-screen .market-climate.climate-unknown{--climate-tone:var(--muted);--climate-bg:var(--input);border-color:var(--line)}
.market-climate-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.market-climate-kicker{display:block;color:var(--cyan);font-size:10px!important;line-height:1.2!important;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.market-climate-head h2{margin:4px 0 2px!important;font-size:21px!important;line-height:1.1!important;letter-spacing:-.02em}
.market-climate-head p{margin:0;color:var(--muted);font-size:10px!important;line-height:1.35!important}
.market-climate-status{display:inline-flex;align-items:center;gap:6px;padding:7px 9px;border:1px solid color-mix(in srgb,var(--climate-tone),transparent 55%);border-radius:999px;background:var(--climate-bg);color:var(--climate-tone);font-size:10px!important;line-height:1!important;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.market-climate-status i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,var(--climate-tone),transparent 82%)}
.market-climate-subtitle{margin:9px 0 0!important;color:var(--muted);font-size:12px!important;line-height:1.45!important}
.market-climate-track{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin:15px 0 7px;padding-top:1px}
.market-climate-track:before{content:"";position:absolute;left:0;right:0;top:6px;height:4px;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--yellow),#e49c67,var(--red));opacity:.78}
.market-climate-track-point{position:relative;padding-top:16px;color:var(--muted);font-size:9px!important;line-height:1.2!important;text-transform:uppercase;letter-spacing:.06em}
.market-climate-track-point:before{content:"";position:absolute;top:2px;left:0;width:9px;height:9px;border:2px solid var(--panel);border-radius:50%;background:var(--muted);box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.market-climate-track-point.active{color:var(--text);font-weight:800}
.market-climate-track-point.active:before{width:13px;height:13px;top:0;background:var(--climate-tone);box-shadow:0 0 0 3px color-mix(in srgb,var(--climate-tone),transparent 78%),0 0 0 1px rgba(255,255,255,.3)}
.market-climate-readout{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border:1px solid color-mix(in srgb,var(--climate-tone),transparent 68%);border-radius:9px;background:color-mix(in srgb,var(--climate-bg),transparent 34%);font-size:11px!important;line-height:1.45!important}
.market-climate-readout b{flex:0 0 auto;color:var(--climate-tone);font-size:10px!important;letter-spacing:.04em;text-transform:uppercase}
.market-climate-readout span{color:var(--text)}
.market-climate-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin:8px 0 0;color:var(--muted);font-size:9px!important;line-height:1.35!important}
.market-climate-meta span+span:before{content:"·";margin-right:7px;color:var(--blue)}
.market-climate-glance{margin-top:13px;padding-top:11px;border-top:1px solid var(--line)}
.market-climate-glance-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.market-climate-glance-head h3{margin:0!important;font-size:12px!important;line-height:1.2!important;letter-spacing:0!important;text-transform:none!important;color:var(--text)!important}
.market-climate-glance-head small{color:var(--muted);font-size:9px!important;line-height:1.3!important;text-align:right}
.market-climate-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.market-climate-reading{min-width:0;border:1px solid var(--line);border-top:2px solid var(--climate-tone);border-radius:8px;background:rgba(9,17,29,.34);overflow:hidden}
.market-climate-reading>summary{display:flex;align-items:flex-start;justify-content:space-between;gap:5px;padding:8px;cursor:pointer;list-style:none;min-height:73px}
.market-climate-reading>summary::-webkit-details-marker{display:none}
.market-climate-reading>summary:hover{background:rgba(70,100,150,.12)}
.market-climate-reading-head{display:flex;gap:6px;min-width:0}
.market-climate-reading-head>span:last-child{min-width:0}
.market-climate-reading-dot{flex:0 0 7px;width:7px;height:7px;margin-top:3px;border-radius:50%;background:var(--climate-tone)}
.market-climate-reading summary small{display:block;color:var(--muted);font-size:9px!important;line-height:1.2!important;text-transform:uppercase;letter-spacing:.06em}
.market-climate-reading summary b{display:block;margin-top:4px;color:var(--climate-tone);font-size:12px!important;line-height:1.2!important;overflow-wrap:anywhere}
.market-climate-reading summary em{display:block;margin-top:4px;color:var(--muted);font-style:normal;font-size:9px!important;line-height:1.3!important;overflow-wrap:anywhere}
.market-climate-info{display:grid;place-items:center;flex:0 0 15px;width:15px;height:15px;border:1px solid var(--line);border-radius:50%;color:var(--blue);font-size:9px!important}
.market-climate-reading-body{padding:0 8px 8px;border-top:1px solid var(--line);font-size:10px!important;line-height:1.45!important;color:var(--muted)}
.market-climate-reading-body p{margin:7px 0!important;font-size:10px!important;line-height:1.45!important}
.market-climate-data-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.market-climate-data{padding:6px;border:1px solid var(--line);border-radius:6px;background:rgba(11,23,42,.55);min-width:0}
.market-climate-data small{display:block;color:var(--muted);font-size:8px!important;line-height:1.2!important;text-transform:uppercase;letter-spacing:.05em}
.market-climate-data b{display:block;margin-top:3px;color:var(--text);font-size:10px!important;line-height:1.25!important;overflow-wrap:anywhere}
.market-climate-boundary{color:var(--muted)!important;font-size:9px!important}
.market-climate-change{display:grid;grid-template-columns:25px minmax(0,1fr);gap:8px;align-items:start;margin-top:10px;padding:8px 9px;border:1px solid #5a4d27;border-radius:8px;background:rgba(59,48,23,.48)}
.market-climate-change>span{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--yellow-bg);color:var(--yellow);font-weight:800}
.market-climate-change small{display:block;color:var(--yellow);font-size:9px!important;line-height:1.2!important;text-transform:uppercase;letter-spacing:.06em}
.market-climate-change b{display:block;margin-top:3px;font-size:11px!important;line-height:1.3!important}
.market-climate-change p{margin:2px 0 0!important;color:var(--muted);font-size:9px!important;line-height:1.35!important}
.market-climate-method{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:9px}
.market-climate-method>div{padding:8px;border:1px solid var(--line);border-radius:7px;background:rgba(21,31,53,.62)}
.market-climate-method small{display:block;color:var(--cyan);font-size:8px!important;line-height:1.2!important;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.market-climate-method b{display:block;margin-top:3px;font-size:10px!important;line-height:1.25!important}
.market-climate-method p{margin:4px 0 0!important;color:var(--muted);font-size:9px!important;line-height:1.35!important}
.market-climate-evidence{margin-top:9px;border:1px solid var(--line);border-radius:8px;background:rgba(13,24,42,.48);overflow:hidden}
.market-climate-evidence>summary{padding:8px 9px;cursor:pointer;color:var(--text);font-size:10px!important;line-height:1.3!important;list-style:none}
.market-climate-evidence>summary::-webkit-details-marker{display:none}
.market-climate-evidence>summary:after{content:"+";float:right;color:var(--blue);font-size:16px;line-height:10px}
.market-climate-evidence[open]>summary:after{content:"−"}
.market-climate-evidence>summary small{display:block;margin-top:3px;margin-left:0;color:var(--muted);font-size:9px!important;font-weight:400}
.market-climate-evidence>div{padding:0 9px 8px}
.market-climate-footnote{margin:7px 0 0!important;color:var(--muted);font-size:9px!important;line-height:1.4!important}
.market-climate-actions{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.market-climate-actions .btn{min-height:32px;padding:6px 9px;font-size:10px}
.market-climate-actions>span{color:var(--muted);font-size:9px!important;line-height:1.3!important}

/* Unified Scout / Coin Desk. One record, three scopes, no duplicate library room. */
#main .triage-page{max-width:100%;color:var(--text)}
#main .triage-kicker{color:var(--cyan);font-size:10px;line-height:1.2;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
#main .triage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:13px}
#main .triage-head h2{margin:5px 0 5px;font-size:25px;letter-spacing:-.03em}
#main .triage-head p{max-width:670px;margin:0;color:var(--muted);font-size:12px;line-height:1.5}
#main .triage-plans-button{border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--text);padding:10px 12px;min-height:40px;font-size:11px;font-weight:750;white-space:nowrap}
#main .triage-plans-button:hover{border-color:var(--accent)}
#main .triage-method{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 13px;padding:9px 11px;border-left:3px solid var(--cyan);background:rgba(23,50,76,.38);color:var(--muted);font-size:10px;line-height:1.35}
#main .triage-method b{color:var(--text)}
#main .triage-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 13px}
#main .triage-stats button{min-height:66px;padding:10px;text-align:left;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);font-size:11px}
#main .triage-stats button:hover,#main .triage-stats button[aria-pressed=true]{border-color:var(--accent);background:var(--panel-2)}
#main .triage-stats b{display:block;margin-bottom:3px;font-size:21px;line-height:1;color:var(--text)}
#main .triage-stats button:first-child b{color:var(--accent)}
#main .triage-stats button:nth-child(2) b{color:var(--yellow)}
#main .triage-stats button:nth-child(3) b{color:var(--green)}
#main .triage-stats small{display:block;color:var(--muted);font-size:9px;line-height:1.3}
#main .triage-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(290px,.72fr);gap:12px;align-items:start}
#main .triage-scanner{border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line);min-width:0}
#main .triage-tools{padding:12px;border-bottom:1px solid var(--line);background:rgba(22,36,60,.5)}
#main .triage-mode-tabs{display:flex;gap:4px;padding:4px;margin-bottom:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
#main .triage-mode-tabs button{flex:1;min-height:35px;padding:7px 8px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:11px;font-weight:750}

#main .triage-search{display:flex;gap:6px}

#main .triage-search button{min-width:38px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);color:var(--muted);font-size:18px}
#main .triage-filters{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:8px}

#main .triage-unified-change.down b{color:var(--red)}
