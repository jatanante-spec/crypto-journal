/* =====================================================================================
   DENSITY-APPROVED-1 — preview-approved build
   Budget bar: micro strip. Main toolbar: ultra command strip. Spacing: tight tokens.
   Density: compact. Presentation only — no trading, sizing, risk, verdict, Journal,
   Scout, persistence, navigation-destination or identity behaviour is changed here.
   Accessibility carried across from the preview: 40px hit areas are kept behind the thin
   visuals, focus rings stay visible, semantic state colours (green/yellow/red) are
   untouched, and the budget detail hidden on very small screens is still exposed to
   assistive tech through the bar's aria-label and title.
   ===================================================================================== */

/* --- shared density tokens (per Coin Desk layout so each keeps its own character) --- */
body.command-strip-mode{
  --dense-gap:4px;
  --dense-radius:9px;
  --dense-budget-h:22px;
  --dense-strip-h:30px;
  --dense-btn-h:25px;
  --dense-strip-pad:2px 5px;
  --dense-strip-gap:3px;
  --dense-strip-margin:0 0 7px;
  --dense-sticky-top:26px;
  --dense-edge-l:0 0 0 rgba(0,0,0,0);
  --dense-edge-r:0 0 0 rgba(0,0,0,0);
  --dense-drop:0 0 0 rgba(0,0,0,0);
}
body.command-strip-mode[data-coin-desk-layout="lab"]{
  --dense-radius:999px;
  --dense-budget-h:30px;
  --dense-strip-h:34px;
  --dense-btn-h:29px;
  --dense-strip-pad:3px 7px;
  --dense-strip-gap:4px;
  --dense-strip-margin:0 0 9px;
}
body.command-strip-mode[data-coin-desk-layout="focus"]{
  --dense-radius:8px;
  --dense-budget-h:24px;
  --dense-strip-h:32px;
  --dense-btn-h:27px;
  --dense-strip-pad:3px 5px;
  --dense-strip-gap:2px;
  --dense-strip-margin:0 0 8px;
}

/* --- budget bar: micro strip (ideas 02, 03, 04, 06, 13) --- */
body.command-strip-mode #budget{background:var(--bg);border-bottom:0}
body.command-strip-mode[data-coin-desk-layout] #budget .budget-bar{
  position:relative;
  min-height:var(--dense-budget-h)!important;
  padding:2px 10px!important;
  gap:6px!important;
  border:0!important;
  border-radius:0!important;
  box-shadow:none!important;
}
body.command-strip-mode[data-coin-desk-layout] #budget .budget-bar *{font-size:9px!important;line-height:1.35}
body.command-strip-mode[data-coin-desk-layout] #budget .budget-bar strong{font-size:10px!important}
/* a 2px rule along the bottom edge replaces the inline track block */
body.command-strip-mode[data-coin-desk-layout="instrument"] #budget .budget-track,
body.command-strip-mode[data-coin-desk-layout="focus"] #budget .budget-track{
  position:absolute!important;left:0;right:0;bottom:0;height:2px;width:auto!important;
  flex:0 0 auto!important;flex-basis:auto!important;border-radius:0!important;opacity:1;
}
body.command-strip-mode[data-coin-desk-layout="lab"] #budget .budget-track{flex:0 0 44px!important;height:3px!important}
/* Lab keeps its own budget card; only its height tightens. */
body.command-strip-mode[data-coin-desk-layout="lab"] #budget .budget-bar{
  min-height:var(--dense-budget-h)!important;padding:4px 10px!important;gap:7px!important;
  border:1px solid var(--line)!important;border-radius:10px!important;
  background:var(--panel)!important;box-shadow:var(--shadow)!important;
}
/* thin visuals, 40px hit areas kept (idea 18) */
body.command-strip-mode #budget .budget-bar .train-mini{
  min-height:0!important;height:auto!important;font-size:9px!important;padding:0 6px!important;position:relative;
}
body.command-strip-mode #budget .budget-bar .train-mini::after{
  content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:40px;
}
body.command-strip-mode #budget .budget-bar .tip-btn{
  position:relative!important;top:auto!important;right:auto!important;
  width:16px!important;height:16px!important;min-width:16px!important;min-height:16px!important;
  font-size:8px!important;line-height:14px!important;transform:none;
}
body.command-strip-mode #budget .budget-bar .tip-btn::after{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;
}
/* idea 04: below 390px the secondary wording drops out of the strip, but it stays
   in the bar's aria-label and title so the information is never lost. */
@media(max-width:390px){
  body.command-strip-mode #budget .budget-bar>span,
  body.command-strip-mode #budget .budget-bar>b{display:none!important}
}

/* --- command strip: ultra toolbar (ideas 08, 09, 11, 12, 13, 14, 18, 19, 22) --- */
body.command-strip-mode[data-coin-desk-layout] .cmd-strip{
  position:sticky;top:var(--dense-sticky-top);z-index:13;
  min-height:var(--dense-strip-h)!important;
  margin:var(--dense-strip-margin)!important;
  padding:var(--dense-strip-pad)!important;
  gap:var(--dense-strip-gap)!important;
  border-radius:var(--dense-radius)!important;
  align-items:center;overflow-x:auto;overflow-y:hidden;white-space:nowrap;
  scrollbar-width:none;-ms-overflow-style:none;
  box-shadow:var(--dense-edge-l),var(--dense-edge-r),var(--dense-drop);
}
body.command-strip-mode[data-coin-desk-layout] .cmd-strip::-webkit-scrollbar{display:none}
body.command-strip-mode .cmd-strip.overflow-l{--dense-edge-l:inset 12px 0 8px -10px rgba(0,0,0,.85)}
body.command-strip-mode .cmd-strip.overflow-r{--dense-edge-r:inset -12px 0 8px -10px rgba(0,0,0,.85)}
body.command-strip-mode.dense-scrolled .cmd-strip{--dense-drop:0 6px 12px rgba(0,0,0,.34)}
body.command-strip-mode[data-coin-desk-layout] .cmd-btn{
  position:relative;
  min-height:var(--dense-btn-h)!important;height:var(--dense-btn-h)!important;
  padding:2px 8px!important;font-size:9px!important;
  border-radius:calc(var(--dense-radius) - 5px)!important;
}
/* The rail is a horizontal scroll container, so the hit area is grown inside the rail
   instead of past its edges: expanding beyond them would create a phantom vertical scroll. */
body.command-strip-mode[data-coin-desk-layout] .cmd-btn::after{
  content:"";position:absolute;left:0;right:0;top:-8px;bottom:-8px;
}
/* Touch devices get a slightly taller rail so the same chrome stays thumb-friendly. */
@media(pointer:coarse){
  body.command-strip-mode{--dense-strip-h:34px;--dense-btn-h:28px;--dense-budget-h:24px}
  body.command-strip-mode[data-coin-desk-layout="lab"]{--dense-strip-h:37px;--dense-btn-h:31px;--dense-budget-h:31px}
  body.command-strip-mode[data-coin-desk-layout="focus"]{--dense-strip-h:36px;--dense-btn-h:30px;--dense-budget-h:26px}
}
body.command-strip-mode[data-coin-desk-layout] .cmd-btn[data-page]{flex:1 1 0;min-width:46px}
body.command-strip-mode[data-coin-desk-layout] .cmd-input{min-height:20px!important;height:20px!important;font-size:9px!important}
body.command-strip-mode[data-coin-desk-layout] .cmd-pair{font-size:9px!important}
/* focus ring that never shifts layout (idea 19) */
body.command-strip-mode[data-coin-desk-layout] .cmd-btn:focus-visible,
body.command-strip-mode #budget .budget-bar button:focus-visible{
  outline:2px solid var(--accent);outline-offset:1px;

   Row 1  the coin chip opens the existing quick-switch sheet in place; it no longer
          navigates to Scout. The Scout jump is now an explicit, labelled button.
   Row 2  live context for the active coin: price, session change and research state,
          with one action that adapts - Open ticket / Refresh research / View lock.
   Presentation plus two small handlers; no trading, sizing, risk or verdict logic.
   ===================================================================================== */
#main .coin-navigation{
  display:flex!important;flex-direction:column;align-items:stretch!important;
  gap:6px!important;width:100%;max-width:100%;min-width:0;flex:1 1 100%;
}
#main .coin-navigation .coin-nav-row{
  display:flex;align-items:center;gap:5px;width:100%;min-width:0;
}
#main .coin-navigation .coin-library-toggle{
  flex:none;display:inline-flex;align-items:center;gap:4px;position:relative;white-space:nowrap;
}
#main .coin-navigation .coin-library-chevron{color:var(--accent);font-size:10px;line-height:1}
#main .coin-navigation .coin-shortcuts{flex:1 1 0;min-width:0;overflow:hidden}
/* the Scout jump is now its own labelled control, sized like the other desk buttons */
#main .coin-navigation .coin-research-btn{
  flex:none;position:relative;display:inline-flex;align-items:center;justify-content:center;
  min-height:30px;padding:0 9px;margin:0;border:1px solid #3d7dff;border-radius:7px;
  background:rgba(61,125,255,.12);color:#a9c6ff;font-size:10px;font-family:inherit;
  line-height:1;white-space:nowrap;cursor:pointer;
}
/* 40px tap targets behind the 30px visuals */
#main .coin-navigation .coin-library-toggle::after,
#main .coin-navigation .coin-research-btn::after,
#main .coin-navigation .coin-context-action::after{
  content:"";position:absolute;left:0;right:0;top:-5px;bottom:-5px;
}
#main .coin-navigation .coin-context-bar{
  display:flex;align-items:center;gap:8px;min-width:0;
  padding:6px 9px;border:1px solid var(--line);border-left:3px solid #3dcf8e;border-radius:9px;
  background:linear-gradient(90deg,rgba(61,207,142,.10),rgba(20,37,65,.85) 42%);
}
#main .coin-navigation .coin-context-bar.attn{
  border-left-color:#f6cf68;background:linear-gradient(90deg,rgba(246,207,104,.12),rgba(20,37,65,.85) 42%);
}
#main .coin-navigation .coin-context-bar.lock{
  border-left-color:#f6cf68;background:linear-gradient(90deg,rgba(230,195,92,.16),rgba(20,37,65,.85) 42%);
}
#main .coin-navigation .coin-context-lamp{
  width:7px;height:7px;border-radius:50%;flex:none;background:#3dcf8e;
  box-shadow:0 0 0 2px rgba(61,207,142,.16);
}
#main .coin-navigation .coin-context-bar.attn .coin-context-lamp,
#main .coin-navigation .coin-context-bar.lock .coin-context-lamp{
  background:#f6cf68;box-shadow:0 0 0 2px rgba(246,207,104,.16);
}
#main .coin-navigation .coin-context-lead{
  min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:1px;
}
#main .coin-navigation .coin-context-l1{
  display:flex;align-items:baseline;gap:6px;min-width:0;
  font-size:11px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;
}
#main .coin-navigation .coin-context-l1 .up{color:#3dcf8e;font-weight:600}
#main .coin-navigation .coin-context-l1 .down{color:#ff718e;font-weight:600}
#main .coin-navigation .coin-context-state{
  font-size:9px;font-weight:600;padding:1px 6px;border-radius:999px;
  border:1px solid #3dcf8e;color:#3dcf8e;white-space:nowrap;
}
#main .coin-navigation .coin-context-bar.attn .coin-context-state,
#main .coin-navigation .coin-context-bar.lock .coin-context-state{
  border-color:#f6cf68;color:#f6cf68;
}
#main .coin-navigation .coin-context-l2{
  font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#main .coin-navigation .coin-context-action{
  flex:none;position:relative;display:inline-flex;align-items:center;justify-content:center;
  min-height:30px;padding:0 10px;margin:0;border:1px solid #3d7dff;border-radius:7px;
  background:rgba(61,125,255,.18);color:#dbe9ff;font-size:10.5px;font-weight:700;
  font-family:inherit;line-height:1;white-space:nowrap;cursor:pointer;
}
#main .coin-navigation .coin-context-bar.attn .coin-context-action,
#main .coin-navigation .coin-context-bar.lock .coin-context-action{
  border-color:#8a6a2a;background:rgba(246,207,104,.16);color:#ffe6a8;
}
/* keep the Cue Deck dialog header compact - the desk there is a switcher only */
#cd-dialog .coin-navigation .coin-context-bar{display:none}
@media(max-width:650px){
  #main .coin-navigation .coin-context-l2{font-size:9px}
  #main .coin-navigation .coin-context-action{padding:0 8px;font-size:10px}
  #main .coin-navigation .coin-research-btn{padding:0 7px;font-size:9.5px}
}

/* =====================================================================================
   COIN-DESK-STACK-WIN-1 - restore the intended look of the two new desk controls.
   The shared rule body.command-strip-mode #main button:not(...)... (specificity 1,7,2)
   declares min-height:38px, padding:8px 12px, border, background and font-size with
   !important, and it never mentions the desk classes - so it was overriding both new
   buttons and rendering them as plain neutral chips. These selectors mirror that
   :not() chain to win the cascade back.
   ===================================================================================== */
body.command-strip-mode #main .coin-navigation .coin-research-btn:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow){
  min-height:30px!important;padding:0 9px!important;border:1px solid #3d7dff!important;
  background:rgba(61,125,255,.12)!important;color:#a9c6ff!important;
  font-size:10px!important;font-weight:500!important;line-height:1!important;border-radius:7px!important;
}
body.command-strip-mode #main .coin-navigation .coin-context-action:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow){
  min-height:30px!important;padding:0 10px!important;border:1px solid #3d7dff!important;
  background:rgba(61,125,255,.18)!important;color:#dbe9ff!important;
  font-size:10.5px!important;font-weight:700!important;line-height:1!important;border-radius:7px!important;
}
body.command-strip-mode #main .coin-navigation .coin-context-bar.attn .coin-context-action:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow),
body.command-strip-mode #main .coin-navigation .coin-context-bar.lock .coin-context-action:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow){
  border-color:#8a6a2a!important;background:rgba(246,207,104,.16)!important;color:#ffe6a8!important;
}
@media(max-width:650px){
  body.command-strip-mode #main .coin-navigation .coin-research-btn:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow){padding:0 7px!important;font-size:9.5px!important}
  body.command-strip-mode #main .coin-navigation .coin-context-action:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow){padding:0 8px!important;font-size:10px!important}
}

/* =====================================================================================
   COIN-DESK-NO-DUP-1 - the desk's context bar now carries the live quote, so the
   header's own price was showing the same value twice: once in the bar, once beside the
   Fetch button. Drop the duplicate price and keep the header's freshness line, which
   carries information the bar does not (source, age, and the stale flag).
   ===================================================================================== */
.cd-header .cd-quote > b{display:none}
/* =====================================================================================
   MORE-FILTERED-1 - the More tab, filtered.

   Six groups behind a sticky chip rail. Presentation only: the same fields, switches
   and destinations as before, regrouped, with the explanatory prose moved behind a
   per-field "i" chip.

   Two cascade notes, both learned the hard way on this sheet:
     - body.command-strip-mode .card sets padding with !important at (0,2,1), so every
       rule here that fights it must match that specificity and come later in the file.
       The block is appended last for exactly that reason.
     - the shared rule body.command-strip-mode #main button:not(...) at (1,7,2) sets
       min-height, padding, border-radius and font-size with !important. .more-chip,
       .more-info and .more-palette-option were added to its :not() chain so the pill
       shapes and the 17px "i" survive; nothing else about that rule changed.
   ===================================================================================== */
.more-screen { padding-bottom: 2px; }
body.command-strip-mode .more-head { margin: 0 0 8px!important; gap: 10px; align-items: flex-start; }
.more-head > div { min-width: 0; }
.more-updates { flex: 0 0 auto; }

/* ---- sticky chip rail: offset is measured in JS into .style.top, this is the fallback ---- */
.more-filter-rail {
  position: sticky;
  top: 34px;
  z-index: 12;
  display: flex;
  gap: 6px;
  flex-wrap: nowrap;
  overflow-x: auto;
  overflow-y: hidden;
  margin: 0 0 10px;
  padding: 7px 2px;
  background: var(--bg);
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.more-filter-rail::-webkit-scrollbar { display: none; }
.more-chip {
  position: relative;
  flex: 0 0 auto;
  min-height: 32px;
  padding: 0 13px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--input);
  color: var(--muted);
  font-family: inherit;
  font-size: 11px;
  font-weight: 650;
  letter-spacing: .01em;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: color .12s ease, border-color .12s ease, background .12s ease;
}
/* 40px touch target without changing the 32px pill. */
.more-chip::after { content: ""; position: absolute; left: 0; right: 0; top: -4px; bottom: -4px; }
.more-chip:hover { color: var(--text); border-color: var(--accent); }
.more-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.more-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- groups ---- */
.more-groups { display: flex; flex-direction: column; gap: 10px; }
.more-group { overflow: hidden; }
.more-group[hidden] { display: none; }
body.command-strip-mode .more-group { padding: 0!important; }
.more-group-head {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  background: rgba(10, 17, 30, .45);
}
.more-glyph {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--input);
  color: var(--accent);
  font-size: 11px;
  line-height: 1;
}
body.command-strip-mode .more-group-head h3 {
  margin: 0!important;
  font-size: 12px!important;
  font-weight: 700;
  letter-spacing: .02em;
  text-transform: none;
  flex: 1 1 auto;
  min-width: 0;
}
.more-sum {
  flex: 0 0 auto;
  max-width: 46%;
  font-size: 10px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.more-group-body { padding: 12px; }

/* ---- the "i" chip and its note ---- */
.more-info {
  position: relative;
  flex: 0 0 auto;
  width: 17px;
  height: 17px;
  margin: 0 0 0 5px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--input);
  color: var(--muted);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 9px;
  font-weight: 700;
  font-style: italic;
  line-height: 1;
  vertical-align: middle;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
/* 33px touch target without changing the 17px circle. */
.more-info::after { content: ""; position: absolute; left: -8px; right: -8px; top: -8px; bottom: -8px; }
.more-info:hover { color: var(--text); border-color: var(--accent); }
.more-info.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.more-info:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.more-hint {
  display: none;
  margin: 8px 0 0;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-left: 2px solid var(--accent);
  border-radius: 8px;
  background: var(--input);
  font-size: 11.5px;
  line-height: 1.55;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.more-hint.open { display: block; }
/* A note sits between two cluster rows, which breaks the adjacent-sibling border rule. */
.more-hint + .cluster-row .cell { border-top: 1px solid #5c4d1d; }

/* ---- the label + i rows that replaced .cluster-tag blocks ---- */
.more-tag-row { display: flex; align-items: center; gap: 2px; margin: 13px 0 0; }
.more-tag-row:first-child { margin-top: 0; }
.more-tag-row > span {
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--yellow);
}

/* ---- palette: the same segmented treatment the two layout pickers already use ---- */
.more-palette { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 9px; }
.more-palette-option {
  display: block;
  min-height: 52px;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--input);
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.more-palette-option b { display: block; font-size: 12px; font-weight: 700; color: var(--text); }
.more-palette-option small { display: block; margin-top: 3px; font-size: 9px; line-height: 1.3; color: var(--muted); }
.more-palette-option:hover { border-color: var(--accent); }
.more-palette-option.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.more-palette-option.selected b { color: var(--accent); }
.more-palette-option:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- action rows: Tools and Data ---- */
.more-tool-row { margin-top: 2px; }
.more-tool-row > .btn { flex: 1 1 auto; }
.more-data-status {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 10px;
  margin-bottom: 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--input);
}
.more-data-status .status { font-size: 11px; }
.more-data-count { flex: 0 0 auto; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---- the two layout pickers keep their own cards, they only lose the outer margin ---- */
.more-group-body > .coin-desk-layout-settings,
.more-group-body > .scout-triage-layout-settings { margin-top: 13px; }
.more-group-body > .coin-desk-layout-settings:first-child,
.more-group-body > .scout-triage-layout-settings:first-child { margin-top: 0; }

@media (max-width: 400px) {
  .more-palette { gap: 6px; }
  .more-palette-option { min-height: 48px; padding: 8px; }
  .more-palette-option small { font-size: 8.5px; }
  .more-chip { padding: 0 11px; font-size: 10.5px; }
  .more-sum { max-width: 42%; }
}

/* =====================================================================================
   MORE-LAYOUT-PREVIEW-1 - miniatures of the Coin Desk and Scout layouts inside the
   Look group. Presentation only: the same two settings with the same options, actions
   and destinations, now with a picture of what each one produces.

   Notes for anyone editing this later:
     - the picture is built entirely from spans and carries role="img". It is not
       focusable, not in the tab order, and not a control, which is also why it does
       not have to fight the shared #main button rule.
     - the only real buttons are .mp-toggle and .mp-seg button, and both carry .mp-btn,
       which was added to the :not() chain of all four copies of the shared rule
       body.command-strip-mode #main button:not(...). Without that they would be forced
       to 38px with 8px 12px padding and a 10px radius.
     - the three Coin Desk skins are driven by custom properties on .mp-pic, mirroring
       the real values: strip height, button height, budget-bar height, budget track
       width, heading size, evidence-panel weight and accent colour.
   ===================================================================================== */
.mp-panel {
  display: block;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--input);
  margin: 0 0 12px;
  overflow: hidden;
}
.mp-collapsed .mp-bar { border-bottom: 0; }
.mp-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 9px;
  border-bottom: 1px solid var(--line);
  background: rgba(10, 17, 30, .5);
}
.mp-bar-title {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 9px;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: #5d6d8c;
}
/* No overflow:hidden here: it would clip the ::after that gives these small controls a
   40px touch target without making them 40px tall. The radii move onto the buttons. */
.mp-seg { display: flex; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 6px; }
.mp-seg button:first-child { border-radius: 5px 0 0 5px; }
.mp-seg button:last-child { border-radius: 0 5px 5px 0; }
.mp-seg button,
.mp-toggle,
.mp-thumb-toggle .mp-btn { position: relative; }
.mp-seg button::after,
.mp-toggle::after,
.mp-thumb-toggle .mp-btn::after {
  content: ""; position: absolute; left: 0; right: 0; top: -9px; bottom: -9px;
}
.mp-seg button {
  min-height: 22px;
  padding: 3px 8px;
  border: 0;
  border-right: 1px solid var(--line);
  border-radius: 0;
  background: var(--panel-2);
  color: var(--muted);
  font-family: inherit;
  font-size: 9px;
  cursor: pointer;
}
.mp-seg button:last-child { border-right: 0; }
.mp-seg button.on { background: var(--accent); color: #fff; font-weight: 700; }
.mp-toggle,
.mp-thumb-toggle .mp-btn {
  min-height: 22px;
  padding: 3px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel-2);
  color: var(--muted);
  font-family: inherit;
  font-size: 9px;
  cursor: pointer;
}
.mp-toggle:hover, .mp-seg button:hover { color: var(--text); border-color: var(--accent); }
.mp-toggle:focus-visible, .mp-seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mp-stage { display: block; padding: 9px; }
.mp-note {
  display: block;
  padding: 0 9px 8px;
  font-size: 9px;
  line-height: 1.4;
  color: #5d6d8c;
}
.mp-head-tools { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; flex-wrap: wrap; justify-content: flex-end; }
.mp-thumb-toggle { display: inline-flex; align-items: center; gap: 5px; }
.mp-thumb-toggle > span { font-size: 8.5px; letter-spacing: .07em; text-transform: uppercase; color: #5d6d8c; }

/* ---------- the picture ---------- */
.mp-pic {
  display: block;
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #0b1220;
  overflow: hidden;
  color: var(--text);
  --mp-pad: 9px;
  --mp-strip-h: 44px; --mp-strip-r: 10px; --mp-strip-gap: 6px;
  --mp-btn-h: 34px; --mp-btn-r: 8px; --mp-btn-fs: 11px;
  --mp-bud-h: 34px; --mp-bud-gap: 8px; --mp-bud-bg: rgba(11, 18, 32, .94); --mp-bud-fs: 11px;
  --mp-track-w: 64px; --mp-track-h: 4px; --mp-track-c: #6d9b82; --mp-bud-strong: #6d9b82;
  --mp-h2: 22px;
  --mp-method-fs: 10px; --mp-method-pad: 9px 11px; --mp-method-bw: 3px;
  --mp-method-bc: #4aa8d8; --mp-method-bg: rgba(23, 50, 76, .38);
  --mp-hi: var(--accent);
}
.mp-pic.mp-lab {
  --mp-btn-h: 31px; --mp-bud-h: 39px; --mp-track-w: 54px; --mp-bud-strong: var(--green);
  --mp-method-bc: var(--green); --mp-method-bg: rgba(20, 60, 44, .34); --mp-hi: var(--green);
  --mp-h2: 25px;
}
.mp-pic.mp-focus {
  --mp-strip-h: 37px; --mp-strip-r: 8px; --mp-strip-gap: 2px;
  --mp-btn-h: 29px; --mp-btn-r: 6px; --mp-btn-fs: 10px;
  --mp-bud-h: 29px; --mp-bud-gap: 6px; --mp-bud-bg: transparent; --mp-bud-fs: 10px;
  --mp-track-w: 23px; --mp-track-h: 2px; --mp-h2: 20px;
  --mp-method-fs: 9px; --mp-method-pad: 6px 8px; --mp-method-bw: 2px; --mp-method-bg: rgba(23, 50, 76, .26);
}
/* No blanket `display` on the picture's children: .mp-pic > span is (0,1,1) and silently
   beats every single-class component rule below it, which flattened the strip, the budget
   bar and the ledger rows to plain blocks. Each component says what it is instead. */

.mp-strip {
  display: flex;
  align-items: center;
  gap: var(--mp-strip-gap);
  min-height: var(--mp-strip-h);
  margin: var(--mp-pad) var(--mp-pad) 0;
  padding: 4px 5px;
  border: 1px solid var(--line);
  border-radius: var(--mp-strip-r);
  background: rgba(21, 31, 53, .96);
  overflow: hidden;
}
.mp-sbtn {
  flex: 1 1 0;
  min-width: 0;
  min-height: var(--mp-btn-h);
  padding: 0 4px;
  border-radius: var(--mp-btn-r);
  background: transparent;
  color: var(--muted);
  font-size: calc(var(--mp-btn-fs) - 2px);
  font-weight: 700;
  letter-spacing: .02em;
  white-space: nowrap;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.mp-sbtn.on { background: var(--mp-hi); color: #08121f; }
.mp-sprompt {
  flex: 1.4 1 0;
  min-width: 0;
  min-height: var(--mp-btn-h);
  border: 1px solid var(--line);
  border-radius: var(--mp-btn-r);
  background: var(--panel-2);
  color: #5d6d8c;
  font-size: calc(var(--mp-btn-fs) - 2px);
  display: flex;
  align-items: center;
  padding: 0 6px;
  overflow: hidden;
  white-space: nowrap;
}
.mp-budget {
  display: flex;
  align-items: center;
  gap: var(--mp-bud-gap);
  min-height: var(--mp-bud-h);
  margin: 7px 0 0;
  padding: 0 9px;
  background: var(--mp-bud-bg);
  border-bottom: 1px solid var(--line);
  font-size: var(--mp-bud-fs);
  overflow: hidden;
}
.mp-budget > b { color: var(--mp-bud-strong); font-weight: 650; white-space: nowrap; }
.mp-track {
  display: block;
  flex: 0 0 auto;
  width: var(--mp-track-w);
  height: var(--mp-track-h);
  border-radius: 999px;
  background: rgba(255, 255, 255, .08);
  overflow: hidden;
}
.mp-track > i { display: block; height: 100%; background: var(--mp-track-c); }
.mp-bsub { color: var(--muted); font-size: calc(var(--mp-bud-fs) - 1px); white-space: nowrap; overflow: hidden; }
.mp-train {
  margin-left: auto;
  flex: 0 0 auto;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel-2);
  color: var(--muted);
  font-size: calc(var(--mp-bud-fs) - 3px);
  padding: 1px 5px;
}
.mp-h2 {
  display: block;
  margin: 9px 0 0;
  padding: 0 var(--mp-pad);
  font-size: var(--mp-h2);
  font-weight: 750;
  letter-spacing: -.02em;
  line-height: 1.1;
}
.mp-h2sub {
  display: block;
  padding: 0 var(--mp-pad); margin: 3px 0 0; font-size: 9px; color: var(--muted); line-height: 1.35; }
.mp-coinrow {
  display: flex;
  align-items: center;
  gap: 4px;
  margin: 9px 0 0;
  padding: 0 var(--mp-pad);
  overflow: hidden;
}
.mp-chip {
  flex: 0 0 auto;
  border: 1px solid #466180;
  background: #1a2c46;
  color: #e8eefb;
  border-radius: 999px;
  padding: 4px 8px;
  font-size: 10px;
  font-weight: 700;
}
.mp-tag {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--muted);
  border-radius: 999px;
  padding: 3px 7px;
  font-size: 8.5px;
}
.mp-res {
  margin-left: auto;
  flex: 0 0 auto;
  border: 1px solid var(--accent);
  background: rgba(61, 125, 255, .12);
  color: #cfe0ff;
  border-radius: 7px;
  padding: 4px 7px;
  font-size: 9px;
  font-weight: 700;
}
.mp-ctx {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 5px var(--mp-pad) 0;
  padding: 5px 7px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--mp-hi);
  border-radius: 8px;
  background: rgba(19, 32, 56, .85);
  font-size: 9px;
  overflow: hidden;
}
.mp-lamp {
  display: block;
  width: 6px; height: 6px; border-radius: 50%; background: var(--mp-hi); flex: 0 0 auto; }
.mp-ctx b { font-size: 10px; }
.mp-ctx .up { color: var(--green); }
.mp-ctx .down { color: var(--red); }
.mp-state {
  margin-left: auto;
  flex: 0 0 auto;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 2px 6px;
  color: var(--muted);
  font-size: 8px;
  white-space: nowrap;
}
.mp-method {
  display: block;
  margin: 8px var(--mp-pad) 0;
  padding: var(--mp-method-pad);
  border-left: var(--mp-method-bw) solid var(--mp-method-bc);
  border-radius: 0 7px 7px 0;
  background: var(--mp-method-bg);
  color: var(--muted);
  font-size: var(--mp-method-fs);
  line-height: 1.3;
}
.mp-method b { color: var(--text); }

/* ---------- rows ---------- */
.mp-row {
  display: block;
  margin: 5px var(--mp-pad) 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  padding: 6px 7px;
  overflow: hidden;
}
.mp-row.locked { border-left: 3px solid var(--yellow); }
.mp-coin, .mp-obs, .mp-next, .mp-acts { display: flex; align-items: baseline; gap: 5px; }
.mp-coin b { font-size: 11px; }
.mp-coin small { font-size: 8px; color: var(--muted); }
.mp-health {
  display: inline-block;
  margin-left: auto;
  flex: 0 0 auto;
  font-size: 7.5px;
  font-weight: 800;
  padding: 2px 5px;
  border-radius: 5px;
  white-space: nowrap;
}
.mp-health.ok { color: var(--green); background: rgba(61, 207, 142, .12); }
.mp-health.warn { color: var(--yellow); background: rgba(246, 207, 104, .12); }
.mp-health.lock { color: var(--yellow); background: rgba(246, 207, 104, .18); }
.mp-obs { margin-top: 4px; }
.mp-obs b { font-size: 10px; }
.mp-obs em { font-size: 8px; color: var(--muted); font-style: normal; }
.mp-next { margin-top: 4px; font-size: 8.5px; color: var(--muted); justify-content: space-between; }
.mp-next strong { font-variant-numeric: tabular-nums; }
.mp-next .up { color: var(--green); }
.mp-next .down { color: var(--red); }
.mp-acts { margin-top: 5px; gap: 3px; align-items: center; }
.mp-acts > span {
  flex: 0 0 auto;
  min-height: 19px;
  padding: 1px 6px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--panel-2);
  color: var(--muted);
  font-size: 8px;
  display: flex;
  align-items: center;
}
.mp-acts .mp-star { padding: 1px 4px; color: var(--yellow); }
.mp-acts .mp-go { margin-left: auto; color: #cfe0ff; border-color: #2b456d; background: rgba(61, 125, 255, .10); }

.mp-ledger { display: flex; align-items: center; gap: 6px; padding: 5px 7px; }
.mp-ledger > span { min-width: 0; }
.mp-lid { flex: 0 0 52px; }
.mp-lid b { display: block; font-size: 10.5px; }
.mp-lid small { display: block; font-size: 7.5px; color: var(--muted); }
.mp-lsig { flex: 1 1 auto; }
.mp-lsig b { display: block; font-size: 9.5px; }
.mp-lsig small { display: block; font-size: 7.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mp-lhealth { flex: 0 0 auto; }
.mp-lmeta { flex: 0 0 58px; text-align: right; }
.mp-lmeta strong { display: block; font-size: 9.5px; font-variant-numeric: tabular-nums; }
.mp-lmeta small { display: block; font-size: 7px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mp-lacts {
  flex: 0 0 auto;
  display: flex;
  border: 1px solid #2b456d;
  border-radius: 6px;
  background: #142541;
  overflow: hidden;
}
.mp-lacts > span {
  min-height: 19px;
  padding: 1px 5px;
  border-right: 1px solid #2b456d;
  color: #a7b8d4;
  font-size: 8px;
  display: flex;
  align-items: center;
}
.mp-lacts > span:last-child { border-right: 0; color: var(--accent); }

/* ---------- sizer screen ---------- */
.mp-dec {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 9px var(--mp-pad) 0;
  padding: 0 0 7px;
  border-bottom: 1px solid var(--line);
}
.mp-dec .mp-lamp { width: 8px; height: 8px; }
.mp-dec b { font-size: 12px; }
.mp-dec small { color: var(--muted); font-size: 8.5px; }
.mp-ticket {
  display: block;
  margin: 8px var(--mp-pad) 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  padding: 7px 8px;
}
.mp-th { display: block; font-size: 8.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.mp-fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.mp-fields > span {
  display: block;
  border: 1px solid #5c4d1d; background: rgba(246, 207, 104, .05); border-radius: 5px; padding: 3px 5px; }
.mp-fields small { display: block; font-size: 7.5px; color: var(--muted); }
.mp-fields b { display: block; font-size: 9.5px; font-variant-numeric: tabular-nums; }
.mp-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--line); }
.mp-metrics > span { display: block; }
.mp-metrics small { display: block; font-size: 7.5px; color: var(--muted); }
.mp-metrics b { display: block; font-size: 10px; font-variant-numeric: tabular-nums; }

/* ---------- thumbnails inside the option cards ---------- */
.mp-thumb { display: block; margin: 0 0 8px; }
.mp-thumbpic { background: #0b1220; }
.coin-desk-layout-option .mp-thumb { margin-bottom: 8px; }
.mp-thumb .mp-strip { margin: 0 0 6px; }
.mp-thumb .mp-budget { margin: 0; }
.mp-thumb .mp-coinrow { margin: 6px 0 0; }
.mp-thumb .mp-row { margin: 0 0 4px; }
.mp-thumb .mp-row:last-child { margin-bottom: 0; }
.mp-thumb .mp-row:first-child { margin-top: 0; }
.coin-desk-layout-option .mp-thumb:first-child { margin-top: 0; }
body.command-strip-mode #main .coin-desk-layout-option .mp-thumb { display: block; }


/* ==========================================================================
   CD-HEADER-FOLD-1 · the coin desk header is two rows, not three.
   The Fetch button folds up into the coin row beside the Scout jump, and the
   quote's age joins the context bar next to the price it describes. The third
   row the header used to spend on a lone button is gone.
   ========================================================================== */
/* Fetch inherits the row's geometry from the shared #main button rules - the same
   38px / radius 10 / 12px the Scout button beside it resolves to - so the two sit as
   equals. Only colour is overridden here; setting min-height or padding would lose to
   the shared rules anyway and would leave the two buttons mismatched instead. */
#main .coin-navigation .coin-fetch-btn{
  /* position:relative is load bearing, not decoration. The ::after below is the 40px tap
     target, and it is position:absolute - with no positioned ancestor it resolves against
     the initial containing block and becomes an invisible full-viewport sheet that eats
     every tap on the screen. Never remove this line. */
  position:relative;
  border:1px solid var(--line)!important;border-radius:10px!important;
  background:var(--panel-2)!important;color:var(--text)!important;
  font-size:12px!important;font-weight:650!important;
}
#main .coin-navigation .coin-fetch-btn[disabled]{opacity:.5;cursor:default}
#main .coin-navigation .coin-fetch-btn.stale{
  border-color:#8a6a2a!important;background:rgba(246,207,104,.16)!important;color:#ffe6a8!important;
  box-shadow:0 0 0 3px rgba(246,207,104,.13);
}
/* 40px tap target around the 38px visual. -1px each side, not -5px: the button is
   38px tall because it inherits the row geometry, so -5px would overshoot the row. */
#main .coin-navigation .coin-fetch-btn::after{
  content:"";position:absolute;left:0;right:0;top:-1px;bottom:-1px;
}
/* the desk note keeps its line; the age sits beside it and the note truncates first */
#main .coin-navigation .coin-context-l2{
  display:flex;align-items:baseline;gap:6px;min-width:0;
  white-space:nowrap;overflow:hidden;
}
#main .coin-navigation .coin-context-note{
  flex:1 1 auto;min-width:0;font-style:normal;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#main .coin-navigation .coin-context-fresh{
  flex:0 0 auto;font-style:normal;white-space:nowrap;color:#7d8fb0;
}
#main .coin-navigation .coin-context-fresh.stale{color:#f6cf68}
/* the Cue Deck dialog is a switcher only - it never fetches */
#cd-dialog .coin-navigation .coin-fetch-btn{display:none}
/* SCOUT-HUB-1 · the rebuilt Scout. One head, one search across three sources,
   three scopes, remove with undo, rows that expand in place. Presentation only. */
#main .triage-compact-page .triage-hub-head{align-items:flex-end;gap:10px;padding:4px 2px 0;margin-bottom:1px}
#main .triage-compact-page .triage-hub-head>div:first-child{min-width:0;flex:1}
#main .triage-compact-page .triage-hub-head h2{font-size:20px;margin:0;line-height:1.05;letter-spacing:-.04em}
#main .triage-compact-page .triage-hub-head #triage-hub-counts{margin-top:3px;font-size:9px;line-height:1.4;color:var(--muted)}
#main .triage-compact-page .triage-hub-head .triage-head-tools{display:flex;align-items:center;gap:6px;flex:0 0 auto}
#main .triage-compact-page .triage-hub-head .triage-plans-button{margin:0;min-height:32px;padding:7px 8px;font-size:9px;position:relative}
#main .triage-edit-button{min-height:32px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);color:var(--muted);font-size:9px;font-weight:750;white-space:nowrap;position:relative}
#main .triage-edit-button.on{border-color:var(--accent);background:rgba(61,125,255,.2);color:var(--text)}
#main .triage-edit-button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* the add button is always visible - Scout is where a coin gets added */
#main .triage-compact-page .triage-add-jump{flex:0 0 40px;width:40px;min-height:40px;border:1px solid var(--accent);border-radius:9px;background:rgba(61,125,255,.2);color:var(--accent);font-size:19px;line-height:1;position:relative}
#main .triage-compact-page .triage-add-jump:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#main .triage-group-label{margin:7px 2px 3px;font-size:8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* last resort only: nothing saved, nothing in the catalogue, nothing from the provider */
#main .triage-manual-row{display:block;padding:10px}
#main .triage-manual-row .triage-unified-main{display:block;padding:0 0 8px;border:0;background:transparent}
#main .triage-manual-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) auto;gap:6px}
#main .triage-manual-fields input{min-width:0;width:100%;padding:9px 8px;border:1px solid var(--line);border-radius:9px;background:var(--input);color:var(--text);font-size:12px}

#main .triage-manual-fields .triage-unified-open{min-height:40px;padding:5px 12px;color:var(--green)}
/* the only surface that can show a Scout message now the Library sheet is gone */
#main .triage-toast-row{display:flex;align-items:center;gap:8px;margin:0 0 7px;padding:8px 10px;border:1px solid #315889;border-radius:10px;background:#142b4d}

#main #triage-undo-remove[hidden]{display:none}

#main .triage-unified-remove:focus-visible{outline:2px solid #ff5c7a;outline-offset:2px}
#main .triage-compact-page .triage-ledger-row.triage-editing .triage-ledger-actions{flex-basis:174px;min-width:174px}
#main .triage-row-detail{grid-column:1 / -1;margin-top:7px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
#main .triage-detail-note{margin:0 0 5px;font-size:10px;line-height:1.55;color:var(--muted)}

#main .triage-detail-actions button{flex:1;min-height:34px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);font-size:10px;font-weight:750;position:relative}

  #main .triage-manual-fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  #main .triage-manual-fields .triage-unified-open{grid-column:1 / -1}
  #main .triage-detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  #main .triage-compact-page .triage-hub-head h2{font-size:18px}
  #main .triage-compact-page .triage-ledger-row.triage-editing .triage-ledger-actions{flex-basis:168px;min-width:168px}
}

/* SCOUT-ROW-ACTIONS-1 · the command-strip density pass squeezed the Scout row action
   buttons into 30–32px boxes with padding:0, so the star glyph and the Lock / Inspect
   labels sat flush against the border. This restores breathing room: the two square
   buttons are widened slightly and all three get real horizontal padding. The group
   still fits inside the existing 132px actions column, so the row geometry is unchanged.
   Same specificity as the rules it overrides, placed later so it wins the tie. */
body.command-strip-mode #main .triage-ledger-actions .triage-unified-star:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow),
body.command-strip-mode #main .triage-ledger-actions .triage-unified-lock:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow),
body.command-strip-mode #main .triage-focus-actions .triage-unified-star:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow),
body.command-strip-mode #main .triage-focus-actions .triage-unified-lock:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow){
  width:36px!important;min-width:36px!important;max-width:36px!important;
  padding:0 4px!important;line-height:1!important;white-space:nowrap!important;
}
body.command-strip-mode #main .triage-ledger-actions .triage-unified-star:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow),
body.command-strip-mode #main .triage-focus-actions .triage-unified-star:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow){
  font-size:13px!important;
}
body.command-strip-mode #main .triage-ledger-actions .triage-unified-open:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow),
body.command-strip-mode #main .triage-focus-actions .triage-unified-open:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow){
  width:58px!important;min-width:58px!important;max-width:58px!important;
  padding:0 8px!important;line-height:1!important;white-space:nowrap!important;
}
@media(max-width:390px){
  body.command-strip-mode #main .triage-ledger-actions .triage-unified-star:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow),
  body.command-strip-mode #main .triage-ledger-actions .triage-unified-lock:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow){
    width:34px!important;min-width:34px!important;max-width:34px!important;
  }
  body.command-strip-mode #main .triage-ledger-actions .triage-unified-open:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow){
    width:56px!important;min-width:56px!important;max-width:56px!important;
  }
}
/* SCOUT-ROW-ACTIONS-2 · why the previous fix did nothing.
   The command-strip density pass ships a blanket rule
     body.command-strip-mode #main button:not(.tip-btn)...:not(.more-palette-option)
   carrying min-height:38px, padding:8px 12px, border-radius:10px and font-size:12px,
   all !important. Its ten :not() clauses give it specificity (1,11,2).
   SCOUT-ROW-ACTIONS-1 used only six :not() clauses, scoring (1,9,1), so it silently
   lost EVERY property: the buttons kept padding:8px 12px, which inside a 36px segment
   leaves 12px of content box, while "Lock" needs ~24px and "Research" ~41px at the
   inherited 12px. Hence labels bursting their borders.
   This block repeats the full ten-clause chain to reach (1,13,1) and win, then restores
   the segmented look: square segments inside the container's 9px radius, real padding,
   and a type size measured against the real Space Grotesk metrics.
     "Lock"    10px -> 23.8px in 28px    "Research"  9px -> 40.6px in 46px
     "Inspect"  9px -> 33.2px in 46px    at <=390px  8px -> 36.1px in 44px
   Tap height and the ::after hit expansion are deliberately left alone. */
body.command-strip-mode #main .triage-ledger-actions:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow):not(.mp-btn):not(.more-chip):not(.more-info):not(.more-palette-option) button,
body.command-strip-mode #main .triage-focus-actions:not(.tip-btn):not(.swing-pivot-hit):not(.swing-now-hit):not(.now-tip):not(.now-key):not(.bar-glow):not(.mp-btn):not(.more-chip):not(.more-info):not(.more-palette-option) button{
  padding:0!important;border-radius:0!important;

/* CLIMATE-LAYOUT-1 · four ways to draw the same four independent readings, chosen from
   the More tab. Presentation only — the values, numbers and boundary notes are identical
   in every layout. The tile is a native <details>, so opening one needs no script and
   cannot disturb scroll position, and an open tile spans the full grid width. */
.climate-layout{display:block}
.climate-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.climate-layout-bar .climate-grid{grid-template-columns:minmax(0,1fr);gap:5px}

.climate-tile{min-width:0;border:1px solid var(--line);border-radius:10px;background:rgba(9,17,29,.34);overflow:hidden}
.climate-tile>summary{display:block;padding:9px 10px;cursor:pointer;list-style:none;min-height:42px;position:relative}
.climate-tile>summary::-webkit-details-marker{display:none}
.climate-tile>summary:hover{background:rgba(70,100,150,.12)}
.climate-tile>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.climate-tile[open]{grid-column:1 / -1}
.climate-tile[open]>summary{background:rgba(61,125,255,.1)}
.climate-sum{display:block;position:relative;padding-right:14px}
.climate-chev{position:absolute;top:0;right:0;font-size:14px;line-height:1;color:var(--muted);font-style:normal}
.climate-tile[open] .climate-chev{transform:rotate(90deg)}

.climate-top{display:flex;align-items:center;gap:8px;min-width:0}
.climate-id{display:flex;flex-direction:column;min-width:0}
.climate-label{font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.climate-val{font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.climate-det{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.climate-arc{flex:0 0 auto;display:block}
.climate-tone-good .climate-val{color:var(--green)}
.climate-tone-mid .climate-val{color:var(--yellow)}
.climate-tone-bad .climate-val{color:var(--red)}
.climate-tone-unknown .climate-val{color:var(--muted)}

.climate-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.climate-chip{padding:2px 6px;border-radius:5px;background:var(--input);border:1px solid var(--line);
  font-size:8.5px;color:var(--muted);white-space:nowrap}
.climate-chip b{color:var(--text);font-variant-numeric:tabular-nums}

.climate-panel-body{padding:9px 10px 10px;margin-top:2px;border-top:1px solid var(--line);
  font-size:11px;line-height:1.6;color:var(--muted)}
.climate-panel-body p{margin:0 0 8px}
.climate-boundary{margin:8px 0 0;padding-top:7px;border-top:1px solid var(--line);font-size:9.5px;color:var(--muted)}

/* B · hero dial — the arc leads and the value sits beneath it */
.climate-tile-hero>summary{text-align:center}
.climate-tile-hero .climate-arc{margin:0 auto 3px}
.climate-tile-hero .climate-val{font-size:13px}
.climate-tile-hero .climate-chips{justify-content:center}

/* C · composite ring — one ring summarises alignment above the tiles */
.climate-ring-row{display:flex;align-items:center;gap:12px;margin-bottom:9px;padding:10px;
  border:1px solid var(--line);border-radius:10px;background:rgba(9,17,29,.34)}
.climate-ring{position:relative;flex:0 0 auto;width:76px;height:76px}
.climate-ring svg{width:76px;height:76px;display:block}
.climate-ring-centre{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.climate-ring-centre b{display:block;font-size:17px;font-weight:800;line-height:1.05}
.climate-ring-centre b i{font-size:10px;font-style:normal;color:var(--muted)}
.climate-ring-centre small{font-size:7.5px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.climate-ring-note{margin:0;font-size:10px;line-height:1.5;color:var(--muted)}

/* D · linear bars — the arc straightened, sorted worst-first */
.climate-bar-row{display:flex;align-items:baseline;gap:8px}
.climate-bar-row small{flex:0 0 66px;font-size:8.5px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.climate-bar-row .climate-val{flex:1;min-width:0;font-size:12px}
.climate-bar-row em{flex:0 0 auto;font-style:normal;font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums}
.climate-bar-track{display:flex;align-items:center;gap:7px;margin-top:6px}
.climate-bar{position:relative;flex:1;min-width:0;height:6px;border-radius:3px;
  background:var(--input);border:1px solid var(--line);overflow:hidden}
.climate-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.climate-bar-good i{background:var(--green)}
.climate-bar-mid i{background:var(--yellow)}
.climate-bar-bad i{background:var(--red)}
.climate-bar-unknown i{background:var(--muted);opacity:.4}
.climate-bar-track small{flex:0 0 auto;font-size:9px;color:var(--muted)}

@media(max-width:390px){
  .climate-grid{gap:5px}
  .climate-val{font-size:13px}
  .climate-tile-hero .climate-val{font-size:12px}
  .climate-ring{width:66px;height:66px}
  .climate-ring svg{width:66px;height:66px}
}

/* CLIMATE-LAYOUT-2 · five more ways to draw the same four readings, chosen from the More
   tab. D1-D5 exist because a plain filled bar reads as progress toward a goal, while these
   readings are a position on a Supportive-to-Fragile continuum. Each new gauge either makes
   the position explicit (rail, diverging, steps) or gives the length something to be read
   against (band) — or drops the gauge entirely (plain), which is the honest answer when the
   bar's width is only a lookup on tone. No-data never draws as zero: it draws as a hatched
   track with no marker, no fill and no filled cells. Presentation only throughout. */

/* every row layout is a single column, like D */
.climate-layout-rail .climate-grid,
.climate-layout-diverging .climate-grid,
.climate-layout-steps .climate-grid,
.climate-layout-band .climate-grid,
.climate-layout-plain .climate-grid{grid-template-columns:minmax(0,1fr);gap:5px}

.climate-row-top{display:flex;align-items:baseline;gap:8px}
.climate-row-top .climate-label{flex:0 0 70px}
.climate-row-top .climate-val{flex:1;min-width:0;font-size:12px}

/* shared footer: the tone word carries the meaning so colour is never the only cue */
.climate-rail-foot{display:flex;justify-content:space-between;gap:8px;margin-top:4px;
  font-size:9px;color:var(--muted)}
.climate-tone-word{flex:0 0 auto;font-size:8px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase}
.climate-tone-good .climate-tone-word{color:var(--green)}
.climate-tone-mid .climate-tone-word{color:var(--yellow)}
.climate-tone-bad .climate-tone-word{color:var(--red)}
.climate-tone-unknown .climate-tone-word{color:var(--muted)}

/* D1 · continuum rail — a marker placed on the scale, not a bar filling up */
.climate-scale{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:8px;
  font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.climate-scale-ends{position:relative;flex:1;height:12px;border-top:1px dashed var(--line)}
.climate-scale-ends b{position:absolute;top:-1px;font-size:8px;font-weight:800}
.climate-scale-l{left:0;color:var(--red)}
.climate-scale-c{left:50%;transform:translateX(-50%);color:var(--yellow)}
.climate-scale-r{right:0;color:var(--green)}
.climate-rail{position:relative;height:9px;border-radius:5px;background:#22314f;margin-top:7px}
.climate-rail-mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;
  background:rgba(230,195,92,.45);transform:translateX(-.5px)}
.climate-rail-thumb{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;
  transform:translate(-50%,-50%);border:2px solid #0b1420;background:var(--muted);
  box-shadow:0 0 0 1px rgba(255,255,255,.22)}
.climate-tone-good .climate-rail-thumb{background:var(--green)}
.climate-tone-mid .climate-rail-thumb{background:var(--yellow)}
.climate-tone-bad .climate-rail-thumb{background:var(--red)}
.climate-rail-unknown{background:repeating-linear-gradient(135deg,#22314f 0 4px,#1a2540 4px 8px);
  border:1px dashed #3a4c72}

/* D2 · diverging — grows from a centre line, so direction carries the meaning */
.climate-div{position:relative;height:11px;border-radius:4px;background:#22314f;
  margin-top:7px;overflow:hidden}
.climate-div-zero{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#4a5d85;
  transform:translateX(-.5px)}
.climate-div-fill{position:absolute;top:1px;bottom:1px;border-radius:3px;background:var(--muted)}
.climate-tone-good .climate-div-fill{background:var(--green)}
.climate-tone-mid .climate-div-fill{background:var(--yellow)}
.climate-tone-bad .climate-div-fill{background:var(--red)}
.climate-div-unknown{background:repeating-linear-gradient(135deg,#22314f 0 4px,#1a2540 4px 8px);
  border:1px dashed #3a4c72}

/* D3 · step meter — discrete cells for a discrete reading */
.climate-steps{display:flex;gap:3px;margin-top:7px}
.climate-steps>span{flex:1;height:9px;border-radius:2px;background:#22314f}
.climate-step-on{background:var(--muted)}
.climate-tone-good .climate-step-on{background:var(--green)}
.climate-tone-mid .climate-step-on{background:var(--yellow)}
.climate-tone-bad .climate-step-on{background:var(--red)}
.climate-steps-unknown>span{background:transparent;border:1px dashed #3a4c72}

/* D4 · neutral band — the length finally has a reference */
.climate-bandwrap{position:relative;height:11px;border-radius:4px;background:#22314f;
  margin-top:7px;overflow:hidden}
.climate-band{position:absolute;top:0;bottom:0;left:38%;right:38%;
  background:rgba(230,195,92,.16);border-left:1px dashed rgba(230,195,92,.5);
  border-right:1px dashed rgba(230,195,92,.5)}
.climate-band-fill{position:absolute;left:0;top:1px;bottom:1px;border-radius:3px;
  background:var(--muted)}
.climate-tone-good .climate-band-fill{background:var(--green)}
.climate-tone-mid .climate-band-fill{background:var(--yellow)}
.climate-tone-bad .climate-band-fill{background:var(--red)}
.climate-bandwrap-unknown{background:repeating-linear-gradient(135deg,#22314f 0 4px,#1a2540 4px 8px);
  border:1px dashed #3a4c72}
.climate-band-key{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;
  margin-bottom:8px;font-size:9.5px;color:var(--muted)}
.climate-band-key b{color:var(--yellow);font-weight:800}

/* D5 · gauge-free — the chip replaces the gauge, so tone is still stated, not just coloured */
.climate-plain-row{display:flex;align-items:center;gap:8px}
.climate-plain-row .climate-row-top{flex:1;min-width:0}
.climate-plain-tools{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.climate-tone-chip{padding:2px 5px;border-radius:4px;border:1px solid currentColor;
  font-size:8px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  white-space:nowrap}
.climate-tone-good .climate-tone-chip{color:var(--green)}
.climate-tone-mid .climate-tone-chip{color:var(--yellow)}
.climate-tone-bad .climate-tone-chip{color:var(--red)}
.climate-tone-unknown .climate-tone-chip{color:var(--muted)}
.climate-layout-plain .climate-chips{margin-top:0}

/* the More tab now offers nine, so they are grouped rather than presented as a wall */
.climate-layout-group{margin-top:12px}
.climate-layout-group:first-of-type{margin-top:0}
.climate-layout-group h4{margin:0 0 6px;font-size:8.5px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted)}

/* SCOUT-VIEWPORT-FIT-1 · two things reserved room at the bottom of Scout that is no
   longer used, so the coin list stopped well short of the screen edge.

   1. .app and #main reserve 58px and 30-62px of bottom padding for .nav, which in the
      base stylesheet is position:fixed;bottom:0. Command-strip-mode moved that nav to
      position:sticky;top:0, so nothing is anchored to the bottom any more and the
      reservation became dead space (measured: 58 + 62 = 120px on a 390px phone).

   2. #triage-rows had a fixed height (460px, 430px under 650px). Measured top is a
      constant 343px on every phone width, so a fixed height is wrong at every size:
      it left 159px of unused screen on a 430x932 display and pushed the box past the
      fold on a 360x640 one.

   Fix: drop the reservation, and let the list grow only as far as its content needs,
   capped at whatever is left of the viewport.

   The cap is measured at runtime (SCOUT-VIEWPORT-FIT-2) rather than trusted to 100dvh.
   100dvh is the obvious unit for this and it measured correctly in headless Chromium
   and in Firefox, but not in Chrome on Android, where it resolves against the collapsing
   browser toolbar and left the list short of the screen edge again. Engines disagree on
   how dvh tracks a moving toolbar; they do not disagree on visualViewport.height. So the
   cap is computed from that and passed to CSS through --scout-rows-cap. The calc() is
   only a first-paint fallback, and 386px is the measured chrome height above the list
   in command-strip-mode. */

@media(max-width:900px){
  body.command-strip-mode:not(.training) .app{padding-bottom:0!important}
}
@media(max-width:760px){
  body.command-strip-mode .app{padding-bottom:0}
}
/* placed after every other #main padding rule so it wins the !important tie */
body.command-strip-mode:not(.training) #main{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))!important}

#main #triage-rows{
  height:auto;
  /* --scout-rows-cap is measured at runtime from visualViewport (SCOUT-VIEWPORT-FIT-2).
     The calc() fallback applies only until the first measurement. */
  max-height:var(--scout-rows-cap, calc(100dvh - 386px - env(safe-area-inset-bottom,0px)));
  min-height:200px;
}
/* on a short or landscape screen there is not enough room for an inner scroll, so let
   the page scroll as a whole instead of trapping the list in a tiny box. The runtime
   measurement sets --scout-rows-cap to none in that case as well, because only it knows
   the real visible height. */
@media(max-height:560px){
  #main #triage-rows{max-height:none;min-height:0}
}
